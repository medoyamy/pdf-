<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مراجعة القضاء — الباب الأول</title>
<style>
:root{--bg1:#dff3e4;--bg2:#f2f8dc;--bg3:#d9f0ea;--g:rgba(255,255,255,.58);--gb:rgba(255,255,255,.8);--t:#14161f;--s:#5b6075;--a:#2a8f5c;--ok:#34b86b;--no:#ff5a4f;--amb:#f0a020;--g1:#b4e1ba;--g2:#86d09b;--g3:#5db97e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg1:#0e2218;--bg2:#17261a;--bg3:#0c2524;--g:rgba(24,50,38,.58);--gb:rgba(255,255,255,.16);--t:#f2f3f8;--s:#a7c2b2;--a:#5fd08f;--g1:#1d4a33;--g2:#245d3f;--g3:#2d704b}}
:root[data-theme=dark]{--bg1:#0e2218;--bg2:#17261a;--bg3:#0c2524;--g:rgba(24,50,38,.58);--gb:rgba(255,255,255,.16);--t:#f2f3f8;--s:#a7c2b2;--a:#5fd08f;--g1:#1d4a33;--g2:#245d3f;--g3:#2d704b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:Roboto,"Noto Sans Arabic",-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--t);background:radial-gradient(circle at 85% 8%,var(--bg2),transparent 55%),radial-gradient(circle at 10% 55%,var(--bg1),transparent 60%),radial-gradient(circle at 80% 95%,var(--bg3),transparent 55%),var(--bg1);background-attachment:fixed;padding:10px 14px 130px;line-height:1.8}
header{position:sticky;top:8px;z-index:8;display:flex;justify-content:space-between;align-items:center;padding:11px 18px;border-radius:26px;background:var(--g);border:1px solid var(--gb);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);margin-bottom:14px;box-shadow:0 6px 24px rgba(20,70,45,.12)}
header h1{font-size:18px;margin:0}header span{font-size:12px;font-weight:700;color:var(--a);background:var(--gb);padding:2px 12px;border-radius:99px}
h2{font-size:15px;color:var(--a);margin:20px 6px 8px}h3{font-size:14px;margin:0 0 12px}
.c{background:var(--g);border:1px solid var(--gb);border-radius:24px;padding:14px 16px;margin:0 0 10px;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:0 6px 24px rgba(20,70,45,.1),inset 0 1px 0 var(--gb)}
summary{font-weight:700;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
summary::-webkit-details-marker{display:none}summary:after{content:"‹";color:var(--a);transition:.3s;transform:rotate(-90deg)}
details[open] summary:after{transform:rotate(90deg)}
details p{margin:10px 0 0;font-size:14px;color:var(--s);border-top:1px solid var(--gb);padding-top:8px}
.pane{display:none}.pane.on{display:block;animation:f .4s cubic-bezier(.2,1.4,.4,1)}@keyframes f{from{opacity:0;transform:translateY(14px) scale(.98)}}
button,details.c{position:relative;overflow:hidden;transition:transform .6s cubic-bezier(.2,2.4,.35,1),background .25s;touch-action:manipulation}
button:active,details.c:active{transform:scale(.93);transition:transform .1s ease-out}
button::after,details.c::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.5),transparent 60%);opacity:0;transition:opacity .6s}
button:active::after,details.c:active::after{opacity:1;transition:opacity .08s}
button{font:inherit;color:var(--t);background:var(--g);border:1px solid var(--gb);border-radius:16px;padding:10px 12px;cursor:pointer}
.r{display:flex;gap:8px}.r button{flex:1}.o{display:block;width:100%;text-align:right;margin-top:8px}
.pr{background:var(--a);color:#fff;border:0;font-weight:700}
.ok{background:var(--ok)!important;color:#fff!important}.no{background:var(--no)!important;color:#fff!important}
.n{font-size:12.5px;color:var(--s);margin-top:8px;display:block}
.sc{display:inline-block;padding:4px 14px;border-radius:99px;background:var(--g);border:1px solid var(--gb);font-size:13px;font-weight:700;margin-bottom:10px}
.m{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mi{font-size:12.5px;padding:8px;text-align:center;line-height:1.5;width:100%;margin-bottom:8px}
.sel{outline:2px solid var(--a)}.d{background:var(--ok);color:#fff;pointer-events:none}.x{background:var(--no);color:#fff;animation:k .4s}
@keyframes k{25%{translate:6px}75%{translate:-6px}}
.ring{width:150px;height:150px;display:block;margin:4px auto 6px}
.bar{height:9px;border-radius:9px;background:var(--gb);overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:9px;background:var(--a);transition:width .9s cubic-bezier(.2,1.4,.4,1)}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;padding:8px 4px 6px;border-radius:30px;background:var(--g);border:1px solid var(--gb);backdrop-filter:blur(30px) saturate(200%);-webkit-backdrop-filter:blur(30px) saturate(200%);box-shadow:0 10px 34px rgba(15,60,40,.22);z-index:9}
nav button{flex:1;background:none;border:0;border-radius:18px;font-size:11px;font-weight:600;color:var(--s);padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
.ic{width:38px;height:30px;border-radius:15px;display:grid;place-items:center;transition:width .6s cubic-bezier(.2,2.2,.35,1),background .3s}.ic svg{width:22px;height:22px}
nav .on{color:var(--a)}nav .on .ic{width:64px;background:rgba(46,149,97,.2)}

summary{align-items:center}.q{flex:1}
.ck{width:24px;height:24px;flex:none;stroke:var(--ok)}.ck .b{stroke:var(--gb)}
.ck .c1{stroke-dasharray:63;stroke-dashoffset:63;transform-box:fill-box;transform-origin:center;rotate:-90deg;transition:stroke-dashoffset .7s cubic-bezier(.4,.1,.2,1)}
.ck path{stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .45s .5s ease-out}
.seen .ck .c1,.seen .ck path{stroke-dashoffset:0}details.seen{border-color:rgba(47,179,92,.6)}
.ic{position:relative}.lb{position:absolute;width:13px;height:13px;right:-2px;bottom:-3px;display:none;background:var(--bg1);border-radius:50%;padding:1px}
nav .lk{opacity:.5}nav .lk .lb{display:block}

@keyframes brt{50%{transform:scale(1.02,.98)}}
.cat g{transition:opacity .25s}.eh,.mh,.ms,.br,.bl{opacity:0}
.happy .eo,.happy .mo{opacity:0}.happy .eh,.happy .mh,.happy .bl,.sad .ms,.sad .br{opacity:1}.sad .mo{opacity:0}.sad .pp{transform:translateY(2px)}
.eo,.ea,.tl{transform-box:fill-box}.eo{transform-origin:center;animation:bk 4.5s infinite}
@keyframes bk{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.tl{transform-origin:0 100%;animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{transform:rotate(14deg)}}
.ea.l{transform-origin:100% 100%}.ea.r{transform-origin:0 100%}
.hop .ea.l{animation:ew .35s 3}.hop .ea.r{animation:ew2 .35s 3}@keyframes ew{50%{transform:rotate(-9deg)}}@keyframes ew2{50%{transform:rotate(9deg)}}
#cat.hop .cat{animation:hop .95s cubic-bezier(.3,.7,.4,1)}
@keyframes hop{0%{transform:none}30%{transform:translateY(-14px) scale(.94,1.1)}55%{transform:translateY(0) scale(1.12,.87)}75%{transform:translateY(-4px)}100%{transform:none}}
#cat.dr .cat{animation:dr 1.1s ease-in-out}
@keyframes dr{0%,100%{transform:none}20%{transform:rotate(-7deg) scale(.96)}40%{transform:rotate(6deg) scale(.96)}60%{transform:rotate(-4deg) scale(.97)}}
#say{background:var(--g);border:1px solid var(--gb);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:7px 13px;border-radius:18px 18px 18px 4px;font-size:12.5px;font-weight:700;max-width:190px;margin-bottom:30px;opacity:0;scale:.5;transform-origin:0 100%;transition:opacity .2s,scale .5s cubic-bezier(.2,2.2,.35,1)}
.sp{transform-box:fill-box;transform-origin:center;animation:tn 2.2s ease-in-out infinite}.sp.s2{animation-delay:1.1s}@keyframes tn{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1);opacity:1}}
#say.on{opacity:1;scale:1}
.cat{pointer-events:auto;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;rotate:var(--tl,0deg);transition:rotate .35s cubic-bezier(.2,2,.4,1),scale .55s cubic-bezier(.2,2.4,.35,1)}
.mp{opacity:0}.ch,.bk{transform-box:fill-box;transform-origin:center;transition:transform .55s cubic-bezier(.2,2.4,.35,1)}
#cat.pet .cat{scale:.93 .88;transition:rotate .35s,scale .12s ease-out;animation:purr .14s linear infinite}
@keyframes purr{0%,100%{transform:translateX(-.7px)}50%{transform:translateX(.7px)}}
.pet .eo,.pet .mo,.pet .mh,.pet .ms{opacity:0}.pet .eh,.pet .mp,.pet .bl{opacity:1}.pet .br{opacity:0}
.pet .ch{transform:scale(1.55,1.35)}.pet .bk{transform:scale(1.4,1.25)}
.ht{position:absolute;pointer-events:none;color:#ff6b8a;font-size:15px;animation:fl 1.1s ease-out forwards}
@keyframes fl{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-52px) scale(1.25) rotate(14deg)}}
#gr{position:fixed;left:0;right:0;bottom:0;width:100%;height:92px;z-index:-1;pointer-events:none}
#gr path{animation:sw 7s ease-in-out infinite}.g1{fill:var(--g1)}.g2{fill:var(--g2)}.g3{fill:var(--g3)}
@keyframes sw{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.6deg)}}
@media(prefers-reduced-motion:reduce){#gr path{animation:none}}
.hd{margin:8px 0;padding:9px 12px;border-right:3px solid var(--a);background:var(--gb);border-radius:14px;color:var(--t);font-size:13.5px;line-height:1.9}.hd small{display:block;color:var(--a);font-size:11.5px;font-weight:700;margin-top:3px}details p b{color:var(--t)}
</style></head><body>

<script>
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);
const SUM=["الفصل الأول: القضاء — تعريفه وأدلته وأنواعه وأحكامه",
["ما معنى القضاء لغةً؟","له معانٍ كثيرة: الأمر، الحكم، الإتمام، الأداء، الإلزام، الفصل، الفعل، الخلق، الموت؛ وحصرها المفسرون في عشرة وجوه."],
["عرّف القضاء اصطلاحًا عند المذاهب.","الحنفية: الإلزام ويقال له الحكم. المالكية: صفة حكمية توجب لموصوفها نفوذ حكمه الشرعي. الشافعية: الإلزام بحكم الشرع في الواقعة الخاصة أو فصل الخصومة. الحنابلة: الإلزام بالحكم الشرعي وفصل الخصومات."],
["ما الراجح في حقيقة القضاء؟","ولاية شرعية على الفصل في الخصومات بين الناس وإلزام المتخاصمين بالحكم الشرعي؛ والقاضي مُظهِر للحكم لا مُنشئ له."],
["اذكر أدلة مشروعية القضاء.","<b>الكتاب:</b> ﴿يا داود إنا جعلناك خليفة في الأرض فاحكم بين الناس بالحق﴾، ﴿وإذا حكمتم بين الناس أن تحكموا بالعدل﴾، ﴿فلا وربك لا يؤمنون حتى يحكّموك فيما شجر بينهم﴾.<br><b>السنة:</b><blockquote class='hd'>«لا حسد إلا في اثنتين: رجل آتاه الله مالًا فسلّطه على هلكته في الحق، ورجل آتاه الله حكمة فهو يقضي بها ويعلّمها»<small>متفق عليه (ابن مسعود)</small></blockquote><blockquote class='hd'>«أتدرون من السابقون إلى ظل الله يوم القيامة؟ قالوا: الله ورسوله أعلم، قال: الذين إذا أُعطوا الحق قبلوه، وإذا سُئلوه بذلوه، وإذا حكموا للناس حكموا كحكمهم لأنفسهم»<small>رواه أحمد</small></blockquote><blockquote class='hd'>«إن المقسطين عند الله على منابر من نور، عن يمين الرحمن عز وجل، وكلتا يديه يمين، الذين يعدلون في حكمهم وأهليهم وما ولّوا»<small>رواه مسلم (عبد الله بن عمرو)</small></blockquote><blockquote class='hd'>«إذا جلس القاضي في مجلسه هبط عليه ملكان يسدّدانه ويوفّقانه ويرشدانه ما لم يجر، فإذا جار عرجا وتركاه»<small>أورده الكتاب في أدلة السنة</small></blockquote><blockquote class='hd'>«إذا حكم الحاكم فاجتهد ثم أصاب فله أجران، وإذا حكم فاجتهد ثم أخطأ فله أجر»<small>متفق عليه (عمرو بن العاص)</small></blockquote><b>الإجماع:</b> انعقد على وجوب القضاء ونصب القضاة. <b>المعقول:</b> حاجة الناس إلى من يفصل بينهم."],
["ما حكمة مشروعية القضاء؟","الإنسان مدني بطبعه، وحب المال والتنافس يولّد النزاع؛ فلا بد من من يفصل بين الناس ويقيم العدل ويحفظ الحقوق فيتحقق الأمن والاستقرار."],
["القضاء بين الترغيب والترهيب؟","<b>الترغيب:</b><blockquote class='hd'>«لا حسد إلا في اثنتين: رجل آتاه الله مالًا فسلّطه على هلكته في الحق، ورجل آتاه الله حكمة فهو يقضي بها ويعلّمها»<small>متفق عليه (ابن مسعود)</small></blockquote><blockquote class='hd'>«سبعة يظلهم الله في ظله يوم لا ظل إلا ظله: الإمام العادل، وشاب نشأ في عبادة ربه، ورجل قلبه معلّق بالمساجد، ورجلان تحابّا في الله اجتمعا عليه وتفرّقا عليه، ورجل طلبته امرأة ذات منصب وجمال فقال: إني أخاف الله، ورجل تصدّق بصدقة فأخفاها حتى لا تعلم شماله ما تنفق يمينه، ورجل ذكر الله خاليًا ففاضت عيناه»<small>متفق عليه (أبو هريرة)</small></blockquote><blockquote class='hd'>«إن المقسطين عند الله على منابر من نور، عن يمين الرحمن عز وجل، وكلتا يديه يمين، الذين يعدلون في حكمهم وأهليهم وما ولّوا»<small>رواه مسلم (عبد الله بن عمرو)</small></blockquote><b>الترهيب:</b><blockquote class='hd'>«القضاة ثلاثة: قاضيان في النار وقاضٍ في الجنة: رجل عرف الحق فقضى به فهو في الجنة، ورجل عرف الحق فلم يقضِ به وجار في الحكم فهو في النار، ورجل لم يعرف الحق فقضى للناس على جهل فهو في النار»<small>أبو داود والترمذي وابن ماجه (بريدة)</small></blockquote><blockquote class='hd'>«من ولي القضاء فقد ذُبح بغير سكين»<small>أبو داود والترمذي وابن ماجه وأحمد (أبو هريرة)</small></blockquote><blockquote class='hd'>«يُجاء بالقاضي يوم القيامة فيلقى من شدة الحساب ما يودّ أنه لم يكن قضى بين اثنين في تمرة»<small>أورده الكتاب</small></blockquote>وامتنع عن القضاء أبو حنيفة وغيره ورعًا."],
["كيف يُجمع بين أدلتهما؟","الترغيب لمن توافرت فيه الشروط وأمن على نفسه الجور والهوى، والترهيب لمن لم تتوافر فيه أو خاف الظلم."],
["ما أنواع القضاء؟","القضاء العادي (الخصومات)، وقضاء المظالم، وقضاء الحسبة. وهي ولايات مستقلة أحكامها متغيرة يجوز الاجتهاد فيها."],
["ما خصائص القضاء العادي؟","وجود خصومة يرفعها صاحب الحق؛ الالتزام بالإجراءات والبينة لا الظن؛ الحكم ملزم؛ اختصاص القاضي محدد بما فُوّض إليه."],
["ما الحكم التكليفي لطلب القضاء؟","الأصل فرض كفاية. واجب (فرض عين) إذا لم يوجد غيره صالح؛ مستحب للعالم غير المشهور؛ محرم على الجاهل ومن يطلبه للانتقام أو الرشوة؛ مكروه إن لم تكن حاجة؛ مباح لمن يطلبه لحاجة رزقه."],
["الفرق بين الحكم القضائي والفتوى؟","القضاء إلزام والفتوى إخبار غير ملزم؛ القضاء يرفع الخلاف والفتوى لا ترفعه؛ القضاء خاص بالمتخاصمين والفتوى عامة؛ القاضي لا يقضي لنفسه وأقاربه والمفتي يجوز له؛ يُشترط في القاضي الذكورة لا المفتي."],
["الفرق بين الحكم القضائي والقرار الإداري؟","القضائي يصدر في منازعة وبطلب صاحب الحق وبشكليات محددة؛ الإداري لا يشترط له منازعة ويصدر من الإدارة من تلقاء نفسها."],
["الفرق بين القضاء والتحكيم؟","القاضي يعيّنه ولي الأمر والمحكَّم يختاره الخصوم؛ شروط المحكَّم أخف؛ حكمه لا يلزم إلا من رضي به؛ ولا يفصل المحكَّم في العقوبات والحدود."],
"الفصل الثاني: قضاء الحسبة",
["عرّف الحسبة.","لغة: من احتسب، وتدور حول الحساب والعدّ وطلب الأجر والثواب. اصطلاحًا: قيام المختص بالأمر بالمعروف إذا ظهر تركه والنهي عن المنكر إذا ظهر فعله لتحقيق مصلحة عامة أو دفع مفسدة، وحكمها فرض كفاية."],
["ما أدلة مشروعية الحسبة؟","﴿ولتكن منكم أمة يدعون إلى الخير ويأمرون بالمعروف وينهون عن المنكر وأولئك هم المفلحون﴾، ﴿كنتم خير أمة أخرجت للناس تأمرون بالمعروف وتنهون عن المنكر﴾، ﴿والمؤمنون والمؤمنات بعضهم أولياء بعض يأمرون بالمعروف وينهون عن المنكر﴾.<blockquote class='hd'>«من رأى منكم منكرًا فليغيّره بيده، فإن لم يستطع فبلسانه، فإن لم يستطع فبقلبه، وذلك أضعف الإيمان»<small>رواه مسلم (أبو سعيد الخدري)</small></blockquote>"],
["الفرق بين الحسبة والأمر بالمعروف؟","الأمر بالمعروف أصل عام ومبدأ شرعي، والحسبة تطبيقه المنظم المؤسسي وولاية لها اختصاصات."],
"الفصل الثالث: القضاء العام",
["ما القضاء العام والخاص؟","العام: تفويض القاضي النظر في جميع الأحكام دون تقييد بنوع أو مذهب أو مكان. الخاص: تقييده بنوع أو بلد أو مدة أو مذهب."],
["ما أركان القضاء؟","خمسة: القاضي، المقضي به (الحكم)، المقضي فيه (الدعوى)، المقضي عليه، المقضي له."],
["اذكر شروط القاضي.","الإسلام، التكليف (البلوغ والعقل)، الحرية، الذكورة، العدالة، سلامة الحواس، الاجتهاد."],
["حكم تولية العبد والمرأة؟","العبد: الجمهور لا يجيزون، والظاهرية والزيدية يجيزون.<br>المرأة: الجمهور لا يجيزون، واستدلوا بالحديث:<blockquote class='hd'>لمّا بلغ رسول الله ﷺ أن أهل فارس ملّكوا عليهم بنت كسرى قال: «لن يفلح قوم ولّوا أمرهم امرأة»<small>رواه البخاري (أبو بكرة)</small></blockquote>والحنفية (غير زفر) ينفذ قضاؤها فيما تصح فيه شهادتها دون الحدود والقصاص."],
["حكم اشتراط العدالة وسلامة الحواس؟","العدالة شرط عند الجمهور (وليست شرط صحة عند الحنفية) والراجح اشتراطها. الحواس (السمع والبصر والكلام) يشترطها الجمهور لصحة الولاية."],
["حكم اشتراط الاجتهاد؟","شرط عند المالكية والشافعية والحنابلة وبعض الحنفية؛ وعند أبي حنيفة وبعض المالكية شرط أولوية لا صحة. والراجح اشتراطه عند توفر المجتهدين. ومن أدلتهم:<blockquote class='hd'>«كيف تقضي إذا عرض لك قضاء؟» قال: أقضي بكتاب الله. قال: «فإن لم تجد في كتاب الله؟» قال: فبسنة رسول الله ﷺ. قال: «فإن لم تجد في سنة رسول الله؟» قال: أجتهد رأيي ولا آلو. فضرب رسول الله ﷺ صدره وقال: «الحمد لله الذي وفّق رسول رسول الله لما يرضي رسول الله»<small>أبو داود والترمذي وأحمد (معاذ بن جبل)</small></blockquote><blockquote class='hd'>«إذا حكم الحاكم فاجتهد ثم أصاب فله أجران، وإذا حكم فاجتهد ثم أخطأ فله أجر»<small>متفق عليه (عمرو بن العاص)</small></blockquote>"],
["من يملك تعيين القاضي؟","الإمام (ولي الأمر) أو من يفوّضه؛ وأول من فُوّض إليه اختيار القضاة أبو يوسف صاحب أبي حنيفة. ومن الأدلة تولية النبي ﷺ لعلي ومعاذ اليمن:<blockquote class='hd'>قال علي: بعثني رسول الله ﷺ إلى اليمن قاضيًا فقلت: يا رسول الله، ترسلني وأنا حديث السن ولا علم لي بالقضاء؟ فقال: «إن الله سيهدي قلبك ويثبّت لسانك، فإذا جلس بين يديك الخصمان فلا تقضِ حتى تسمع من الآخر كما سمعت من الأول، فإنه أحرى أن يتبيّن لك القضاء» قال علي: فما زلت قاضيًا، أو ما شككت في قضاء بعد<small>أبو داود والترمذي وأحمد</small></blockquote><blockquote class='hd'>«كيف تقضي إذا عرض لك قضاء؟» قال: أقضي بكتاب الله. قال: «فإن لم تجد في كتاب الله؟» قال: فبسنة رسول الله ﷺ. قال: «فإن لم تجد في سنة رسول الله؟» قال: أجتهد رأيي ولا آلو. فضرب رسول الله ﷺ صدره وقال: «الحمد لله الذي وفّق رسول رسول الله لما يرضي رسول الله»<small>أبو داود والترمذي وأحمد (معاذ بن جبل)</small></blockquote>"],
["اختصاصات القاضي عند الماوردي؟","عشرة، منها: فصل المنازعات، استيفاء الحقوق، الحجر على السفيه، النظر في الأوقاف، تنفيذ الوصايا، تزويج الأيامى، إقامة الحدود، النظر في مصالح عمله، تصفح الشهود والأمناء، والتسوية بين القوي والضعيف."],
["ما أقسام آداب القاضي؟","آداب شخصه وصفاته (التقوى والورع)، وآداب نزاهته وكرامته (التنزه عن الحوائج وقبول الهدية)، وآداب مجلس القضاء."],
["حكم قبول القاضي الهدية؟","تحرم إن لم تجر العادة بها قبل الولاية وكان للمهدي خصومة؛ وتجوز إن جرت العادة ولا دعوى للمهدي (والأولى الرد عند التهمة). ودليل التحريم:<blockquote class='hd'>استعمل النبي ﷺ رجلًا من الأزد يقال له ابن اللتبية على الصدقة، فلما قدم قال: هذا لكم وهذا أُهدي لي. فقام رسول الله ﷺ على المنبر فحمد الله وأثنى عليه ثم قال: «ما بال العامل نبعثه فيأتي فيقول: هذا لكم وهذا أُهدي لي! فهلّا جلس في بيت أبيه وأمه فينظر أيُهدى له أم لا؟ والذي نفس محمد بيده لا ينال أحد منكم منها شيئًا إلا جاء به يوم القيامة يحمله على رقبته: إن كان بعيرًا له رغاء، أو بقرة لها خوار، أو شاة تيعر» ثم رفع يديه حتى رأينا عفرة إبطيه ثم قال: «اللهم هل بلّغت؟» ثلاثًا<small>متفق عليه (أبو حميد الساعدي)</small></blockquote>"],
["ما رزق القاضي وحكم أخذه؟","ما يُفرض له من بيت المال بقدر كفايته ليتفرغ للقضاء. يجوز للفقير اتفاقًا، وفي الغني قولان: الجواز والمنع. ومن الأدلة:<blockquote class='hd'>«من استعملناه على عمل فرزقناه رزقًا فما أخذ بعد ذلك فهو غلول»<small>رواه أبو داود (بريدة)</small></blockquote>"],
["حكم قضاء القاضي بعلمه؟","ثلاثة أقوال: لا يجوز مطلقًا، ويجوز مطلقًا (أبو يوسف)، والجمهور على الجواز فيما علمه في مجلس حكمه. ويجوز اتفاقًا في ترجيح حجة أحد الخصمين.<br><b>دليل المانعين:</b><blockquote class='hd'>«إنما أنا بشر، وإنكم تختصمون إليّ، ولعل بعضكم أن يكون ألحن بحجته من بعض، فأقضي له على نحو ما أسمع، فمن قضيت له بحق أخيه شيئًا فلا يأخذه، فإنما أقطع له قطعة من النار»<small>متفق عليه (أم سلمة)</small></blockquote><b>دليل المجيزين:</b><blockquote class='hd'>جاءت هند بنت عتبة فقالت: يا رسول الله، إن أبا سفيان رجل شحيح، وليس يعطيني ما يكفيني وولدي إلا ما أخذت منه وهو لا يعلم، فقال: «خذي ما يكفيك وولدك بالمعروف»<small>متفق عليه (عائشة)</small></blockquote>"],
["حكم القضاء بالشاهد واليمين؟","اتفقوا على منعه في الحدود والقصاص؛ وفي الأموال يجيزه المالكية والشافعية والحنابلة والظاهرية والزيدية والإمامية، ويمنعه الحنفية.<br><b>أدلة المجيزين:</b><blockquote class='hd'>«أن رسول الله ﷺ قضى باليمين مع الشاهد»<small>رواه مسلم (ابن عباس)</small></blockquote><blockquote class='hd'>«قضى رسول الله ﷺ باليمين مع الشاهد الواحد»<small>أبو داود والترمذي (أبو هريرة)</small></blockquote><blockquote class='hd'>«أن النبي ﷺ قضى بشهادة شاهد واحد ويمين صاحب الحق»<small>ابن ماجه (علي)</small></blockquote><b>دليل المانعين:</b><blockquote class='hd'>«البينة على المدعي واليمين على من أنكر»<small>رواه البيهقي</small></blockquote>"],
"الفصل الرابع: قضاء المظالم",
["عرّف قضاء المظالم.","الماوردي: قود المتظالمين إلى التناصف بالرهبة وزجر المتنازعين عن التجاحد بالهيبة. وهو ولاية أعلى من القضاء العادي تنظر في ظلم الولاة وذوي النفوذ."],
["ما شروط قاضي المظالم؟","جليل القدر، نافذ الأمر، عظيم الهيبة، ظاهر العفة، قليل الطمع، كثير الورع."],
["كيف نشأ قضاء المظالم ومن يعيّن قاضيه؟","نظر فيه النبي ﷺ بنفسه، ولم يُنتدب له أحد من الخلفاء الأربعة. ويعيّن قاضيه الخليفة أو قاضي القضاة. ومن أمثلته قصة الزبير:<blockquote class='hd'>خاصم رجل من الأنصار الزبير عند النبي ﷺ في شِراج الحرّة التي يسقون بها النخل، فقال النبي ﷺ: «اسقِ يا زبير، ثم أرسل الماء إلى جارك» فغضب الأنصاري وقال: أن كان ابن عمتك؟ فتلوّن وجه رسول الله ﷺ ثم قال: «اسقِ يا زبير، ثم احبس الماء حتى يرجع إلى الجدر»<small>متفق عليه</small></blockquote>"],
["أصناف مجلس قاضي المظالم؟","خمسة لا يُستغنى عنهم: الحماة والأعوان، القضاة والحكام، الفقهاء، الكتّاب، الشهود."]];
