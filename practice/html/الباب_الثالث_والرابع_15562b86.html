<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>قضايا المعاملات المالية المعاصرة — الموضوع الثالث والرابع</title>
<style>
:root{--bg1:#dff3e4;--bg2:#f2f8dc;--bg3:#d9f0ea;--g:rgba(255,255,255,.65);--gb:rgba(255,255,255,.85);--t:#14161f;--s:#4a5065;--a:#1f7a4c;--ok:#2eb865;--no:#e84c42;--amb:#e69515;--g1:#b4e1ba;--g2:#86d09b;--g3:#5db97e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg1:#0b1c14;--bg2:#132116;--bg3:#0a1f1e;--g:rgba(20,42,32,.68);--gb:rgba(255,255,255,.15);--t:#f2f5f3;--s:#a3bfb0;--a:#52cf88;--g1:#183d2a;--g2:#1f4f36;--g3:#276343}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:Roboto,"Noto Sans Arabic",-apple-system,Tahoma,sans-serif;color:var(--t);background:radial-gradient(circle at 85% 8%,var(--bg2),transparent 55%),radial-gradient(circle at 10% 55%,var(--bg1),transparent 60%),radial-gradient(circle at 80% 95%,var(--bg3),transparent 55%),var(--bg1);background-attachment:fixed;padding:10px 14px 140px;line-height:1.82;overflow-x:hidden}
header{position:sticky;top:8px;z-index:8;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-radius:26px;background:var(--g);border:1px solid var(--gb);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);margin-bottom:14px;box-shadow:0 6px 24px rgba(20,70,45,.12)}
header h1{font-size:15.5px;margin:0;font-weight:800}.h-act{display:flex;align-items:center;gap:6px}
header span{font-size:12px;font-weight:700;color:var(--a);background:var(--gb);padding:3px 11px;border-radius:99px}
.ul-btn{font-size:11px;padding:4px 10px;border-radius:99px;background:rgba(46,149,97,.15);color:var(--a);border:1px solid var(--a);font-weight:700;cursor:pointer}
h2{font-size:14.5px;color:var(--a);margin:20px 4px 10px;padding:6px 12px;background:var(--g);border-right:4px solid var(--a);border-radius:12px}
h3{font-size:14px;margin:0 0 10px;color:var(--a)}
.c{background:var(--g);border:1px solid var(--gb);border-radius:22px;padding:13px 15px;margin:0 0 10px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 6px 20px rgba(20,70,45,.08)}
summary{font-weight:700;font-size:14.2px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}summary:after{content:"‹";color:var(--a);transition:.3s;transform:rotate(-90deg);font-size:18px;font-weight:900}
details[open] summary:after{transform:rotate(90deg)}
details div.ans{margin:10px 0 0;font-size:13.5px;color:var(--s);border-top:1px solid var(--gb);padding-top:9px}
details div.ans b{color:var(--t)}
.pane{display:none}.pane.on{display:block;animation:f .4s cubic-bezier(.2,1.4,.4,1)}@keyframes f{from{opacity:0;transform:translateY(12px) scale(.98)}}
button,details.c{position:relative;overflow:hidden;transition:transform .45s cubic-bezier(.2,2.2,.35,1),background .25s;touch-action:manipulation}
button:active,details.c:active{transform:scale(.95);transition:transform .1s}
button{font:inherit;color:var(--t);background:var(--g);border:1px solid var(--gb);border-radius:15px;padding:9px 13px;cursor:pointer;font-weight:600}
.r{display:flex;gap:8px;align-items:center}.r button{flex:1}.o{display:block;width:100%;text-align:right;margin-top:7px;font-size:13.3px}
.pr{background:var(--a);color:#fff;border:0;font-weight:700}
.ok{background:var(--ok)!important;color:#fff!important}.no{background:var(--no)!important;color:#fff!important}
.n{font-size:12.8px;color:var(--s);margin-top:8px;display:block}
.sc-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.sc{display:inline-block;padding:4px 14px;border-radius:99px;background:var(--g);border:1px solid var(--gb);font-size:12.8px;font-weight:700;margin-bottom:8px}
.m{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mi{font-size:12.2px;padding:8px;text-align:center;line-height:1.4;width:100%;margin-bottom:7px;min-height:50px;display:flex;align-items:center;justify-content:center}
.sel{outline:2.5px solid var(--a);background:rgba(46,149,97,.15)}.d{background:var(--ok);color:#fff;pointer-events:none}.x{background:var(--no);color:#fff;animation:k .4s}
@keyframes k{25%{translate:6px}75%{translate:-6px}}
.ring{width:145px;height:145px;display:block;margin:4px auto 6px}
.bar{height:9px;border-radius:9px;background:var(--gb);overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:9px;background:var(--a);transition:width .9s cubic-bezier(.2,1.4,.4,1)}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;padding:7px 4px 5px;border-radius:28px;background:var(--g);border:1px solid var(--gb);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 10px 30px rgba(15,60,40,.22);z-index:9}
nav button{flex:1;background:none;border:0;border-radius:16px;font-size:11px;font-weight:700;color:var(--s);padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.ic{width:38px;height:28px;border-radius:14px;display:grid;place-items:center;transition:width .5s cubic-bezier(.2,2.2,.35,1),background .3s;position:relative}.ic svg{width:21px;height:21px}
nav .on{color:var(--a)}nav .on .ic{width:62px;background:rgba(46,149,97,.2)}
.q{flex:1}.ck{width:22px;height:22px;flex:none;stroke:var(--ok)}.ck .b{stroke:var(--gb)}
.ck .c1{stroke-dasharray:63;stroke-dashoffset:63;transform-box:fill-box;transform-origin:center;rotate:-90deg;transition:stroke-dashoffset .6s}
.ck path{stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .4s .4s}
.seen .ck .c1,.seen .ck path{stroke-dashoffset:0}details.seen{border-color:rgba(47,179,92,.6)}
.lb{position:absolute;width:12px;height:12px;right:-2px;bottom:-2px;display:none;background:var(--bg1);border-radius:50%;padding:1px}
nav .lk{opacity:.5}nav .lk .lb{display:block}
.swipe-wrap{max-width:460px;margin:0 auto;position:relative;padding:4px 0 16px}
.swipe-hints{display:flex;justify-content:space-between;padding:0 10px 8px;font-size:12px;font-weight:700;color:var(--s)}
.sh-r{color:var(--ok)}.sh-l{color:var(--no)}
.deck-stage{position:relative;height:280px;perspective:1200px;margin-bottom:12px;user-select:none;-webkit-user-select:none}
.tcard{position:absolute;inset:0;background:var(--g);border:1.5px solid var(--gb);border-radius:26px;padding:20px 18px;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 12px 34px rgba(20,70,45,.15);display:flex;flex-direction:column;justify-content:space-between;touch-action:pan-y;cursor:grab;transform-origin:50% 90%;will-change:transform,opacity;transition:transform .85s cubic-bezier(.19,1,.22,1),opacity .85s cubic-bezier(.19,1,.22,1),box-shadow .4s}
.tcard.bg1{transform:scale(.94) translateY(13px);opacity:.65;pointer-events:none;z-index:1}
.tcard.bg2{transform:scale(.88) translateY(26px);opacity:.35;pointer-events:none;z-index:0}
.tcard.top{z-index:3}
.tcard .qnum{font-size:11.5px;font-weight:800;color:var(--a);background:rgba(46,149,97,.14);padding:3px 11px;border-radius:99px;align-self:flex-start}
.tcard .qtxt{font-size:15.5px;font-weight:800;line-height:1.7;text-align:center;margin:auto 0;color:var(--t)}
.tcard .qfoot{font-size:11px;color:var(--s);text-align:center;opacity:.8}
.stamp{position:absolute;top:20px;padding:5px 14px;border-radius:12px;font-size:17px;font-weight:900;opacity:0;pointer-events:none;transition:opacity .2s,transform .3s;z-index:5}
.stamp.st-ok{right:18px;color:var(--ok);border:3px solid var(--ok);background:rgba(46,184,101,.12);transform:rotate(12deg) scale(.8)}
.stamp.st-no{left:18px;color:var(--no);border:3px solid var(--no);background:rgba(232,76,66,.12);transform:rotate(-12deg) scale(.8)}
.fb-box{min-height:70px;border-radius:18px;padding:10px 14px;margin-bottom:12px;background:var(--g);border:1px solid var(--gb);display:flex;flex-direction:column;justify-content:center}
.fb-box.ok-fb{border-right:5px solid var(--ok);background:rgba(46,184,101,.12)}
.fb-box.no-fb{border-right:5px solid var(--no);background:rgba(232,76,66,.12)}
.swipe-btns{display:flex;gap:12px}.sw-btn{flex:1;padding:12px;border-radius:20px;font-size:14.5px;font-weight:800}
.sw-btn.b-ok{background:rgba(46,184,101,.18);color:var(--ok);border:1.5px solid var(--ok)}
.sw-btn.b-no{background:rgba(232,76,66,.18);color:var(--no);border:1.5px solid var(--no)}
#cat{position:fixed;left:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:7;pointer-events:none;display:flex;align-items:flex-end;gap:2px}

@keyframes brt{50%{transform:scale(1.02,.98)}}
.cat g{transition:opacity .25s}.eh,.mh,.ms,.br,.bl,.mp{opacity:0}
.happy .eo,.happy .mo{opacity:0}.happy .eh,.happy .mh,.happy .bl,.sad .ms,.sad .br{opacity:1}.sad .mo{opacity:0}.sad .pp{transform:translateY(2px)}
.eo,.ea,.tl,.ch,.bk{transform-box:fill-box}.eo{transform-origin:center;animation:bk 4.5s infinite}@keyframes bk{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.tl{transform-origin:0 100%;animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{transform:rotate(14deg)}}
#cat.hop .cat{animation:hop .9s}@keyframes hop{30%{transform:translateY(-14px) scale(.94,1.1)}55%{transform:translateY(0) scale(1.12,.87)}}
#cat.dr .cat{animation:dr 1s}@keyframes dr{20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}}
#say{background:var(--g);border:1px solid var(--gb);backdrop-filter:blur(20px);padding:6px 12px;border-radius:16px 16px 16px 4px;font-size:12px;font-weight:700;max-width:190px;margin-bottom:28px;opacity:0;scale:.5;transform-origin:0 100%;transition:opacity .2s,scale .45s cubic-bezier(.2,2.2,.35,1)}
#say.on{opacity:1;scale:1}
#cat.pet .cat{scale:.93 .88;animation:purr .14s linear infinite}@keyframes purr{50%{transform:translateX(.7px)}}
.pet .eo,.pet .mo,.pet .mh,.pet .ms,.pet .br{opacity:0}.pet .eh,.pet .mp,.pet .bl{opacity:1}
.ht{position:absolute;pointer-events:none;color:#ff6b8a;font-size:15px;animation:fl 1.1s ease-out forwards}@keyframes fl{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-50px) scale(1.2) rotate(14deg)}}
#gr{position:fixed;left:0;right:0;bottom:0;width:100%;height:88px;z-index:-1;pointer-events:none}
#gr path{animation:sw 7s ease-in-out infinite}.g1{fill:var(--g1)}.g2{fill:var(--g2)}.g3{fill:var(--g3)}@keyframes sw{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
.hd{margin:7px 0;padding:8px 11px;border-right:3px solid var(--a);background:var(--gb);border-radius:12px;color:var(--t);font-size:13px;line-height:1.8}
</style></head><body>

<script>
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);

const SUM=[
"الموضوع الثالث: الإجارة المنتهية بالتمليك — الوحدة الأولى: مدخل ومفهوم ونشأة ومزايا (ص ١٣٠ - ١٥٤)",
["١. ما أهمية دراسة عقد الإجارة المنتهية بالتمليك؟ وما منهج البحث فيه؟ (ص ١٣٢-١٣٣)","<b>• أهميته:</b> أفادت المؤسسات الإسلامية من مشروعيته باتخاذه كآلية للنشاط الاقتصادي لصالح الشركات والأفراد الذين لا يملكون السيولة المالية لتملك ما يحتاجون إليه من معدات وأجهزة، لما فيه من مزايا للمؤجر (البائع) والمستأجر (المشتري) لا تتحقق في البيع بالتقسيط.<br><b>• منهج البحث:</b> استخدام <b>المنهج الاستدلالي والاستنباطي</b> الذي يقوم على الاستقراء من خلال ما ورد في القرآن الكريم والسنة النبوية وأقوال السلف والأئمة والمعاصرين."],
["٢. ما تعريف الإجارة لغةً؟ وما المعنى الجامع لمعنييها؟ وما الفرق بينها وبين الإعارة؟ (ص ١٣٣)","<b>• الإجارة لغة:</b> مشتقة من الأجر، والفعل (أجر يأجر)، ولها معنيان: <b>الأول:</b> الكراء على العمل. <b>والثاني:</b> جبر العظم الكسير (فيقال: أجرت يده).<br><b>• المعنى الجامع بينهما:</b> أن أجرة العامل كأنها شيء يجبر به حاله فيما لحقه من كدّ فيما عمله.<br><b>• وفي التعريفات:</b> عقد على المنافع بعوض هو مال؛ فتمليك المنافع بعوض <b>إجارة</b>، وبغير عوض <b>إعارة</b>."],
["٣. عرّف الإجارة شرعاً عند المذاهب الأربعة، مع بيان ما خلت منه أو قُيدت به، وما التعريف المختار؟ (ص ١٣٤-١٣٥)","<b>• الحنفية:</b> عقد على المنفعة بعوض هو مال. (جاء خالياً من ٣ قيود: ١- كون المنفعة مباحة، ٢- مدة الانتفاع معلومة، ٣- كون الأجرة معلومة).<br><b>• المالكية:</b> تمليك منافع شيء مباحة مدة معلومة بعوض. (جاء خالياً من قيد كون العوض معلوماً).<br><b>• الشافعية:</b> عقد على منفعة مقصودة معلومة قابلة للبذل والإباحة بعوض معلوم. (جاء مقيداً بكون المنفعة مقصودة أي ليست بتافهة).<br><b>• الحنابلة:</b> عقد على منفعة مباحة معلومة من عين معينة أو موصوفة في الذمة أو عمل بعوض معلوم.<br><b>• التعريف المختار:</b> تعريف <b>الحنابلة</b>؛ لأنه تعريف جامع شامل لنوعي الإجارة (إجارة المنافع وإجارة الأعمال)، كما شمل إجارة العين المرئية والعين الموصوفة في الذمة، وإن جاء خالياً من قيد كون المنفعة مقصودة أي غير تافهة."],
["٤. اذكر أدلة مشروعية الإجارة من القرآن الكريم (خمس آيات) مع بيان وجه الدلالة من كل آية. (ص ١٣٥-١٣٧)","<b>١- قوله تعالى:</b> ﴿قَالَتْ إِحْدَاهُمَا يَا أَبَتِ اسْتَأْجِرْهُ إِنَّ خَيْرَ مَنِ اسْتَأْجَرْتَ الْقَوِيُّ الْأَمِينُ﴾ [القصص: ٢٦]. <b>وجه الدلالة:</b> أن نبياً أجر نفسه حججاً مسماة يملك بها بضع امرأة، وشرع من قبلنا شرع لنا ما لم ينسخ، فدل على جوازها وأنها من ضرورات الخليقة.<br><b>٢- قوله تعالى:</b> ﴿فَإِنْ أَرْضَعْنَ لَكُمْ فَآتُوهُنَّ أُجُورَهُنَّ﴾ [الطلاق: ٦]. <b>وجه الدلالة:</b> دليل على جواز الإجارة على الرضاع مع جهالة مقداره لاختلافه بكثرة إرضاع المولود وقلته، فلما جازت عليه جازت على ما هو مثله.<br><b>٣- قوله تعالى:</b> ﴿وَرَفَعْنَا بَعْضَهُمْ فَوْقَ بَعْضٍ دَرَجَاتٍ لِّيَتَّخِذَ بَعْضُهُم بَعْضًا سُخْرِيًّا﴾ [الزخرف: ٣٢]. <b>وجه الدلالة:</b> (سخرياً) أي ليستعمل بعضهم بعضاً في مصالحهم ومهنهم ويسخروهم في أشغالهم حتى يتعايشوا.<br><b>٤- قوله تعالى:</b> ﴿وَإِنْ أَرَدتُّمْ أَن تَسْتَرْضِعُوا أَوْلَادَكُمْ فَلَا جُنَاحَ عَلَيْكُمْ إِذَا سَلَّمْتُم مَّا آتَيْتُم بِالْمَعْرُوفِ﴾ [البقرة: ٢٣٣]. <b>وجه الدلالة:</b> نفى الجناح عمن يسترضع لولده ظئراً إذا سلم للمرضعة أجرها بالمعروف.<br><b>٥- قوله تعالى:</b> ﴿فَوَجَدَا فِيهَا جِدَارًا يُرِيدُ أَن يَنقَضَّ فَأَقَامَهُ قَالَ لَوْ شِئْتَ لَتَّخَذْتَ عَلَيْهِ أَجْرًا﴾ [الكهف: ٧٧]. <b>وجه الدلالة:</b> دلت على جواز الإجارة وهي سنة الأنبياء."],
["٥. اذكر أدلة مشروعية الإجارة من السنة النبوية المطهرة (أربعة أحاديث) مع وجه الدلالة. (ص ١٣٧-١٣٩)","<div class='hd'>١- عن ابن عمر رضي الله عنهما قال: قال رسول الله ﷺ: «أَعْطُوا الأَجِيرَ أَجْرَهُ قَبْلَ أَنْ يَجِفَّ عَرَقُهُ» (رواه ابن ماجه) — دل الأمر بالمبادرة بإعطاء الأجر قبل الفراغ من العمل على جواز الإجارة.</div><div class='hd'>٢- عن أبي هريرة رضي الله عنه عن النبي ﷺ قال: قال الله تعالى: «ثَلاثَةٌ أَنَا خَصْمُهُمْ يَوْمَ الْقِيَامَةِ... وَرَجُلٌ اسْتَأْجَرَ أَجِيرًا فَاسْتَوْفَى مِنْهُ وَلَمْ يُعْطِهِ أَجْرَهُ» (رواه البخاري).</div><div class='hd'>٣- عن عائشة رضي الله عنها قالت: «وَاسْتَأْجَرَ رَسُولُ اللهِ ﷺ وَأَبُو بَكْرٍ رَجُلاً مِنْ بَنِي الدِّيلِ هَادِيًا خِرِّيتًا وَهُوَ عَلَى دِينِ كُفَّارِ قُرَيْشٍ» (رواه البخاري) — (الخِرِّيت): الدليل الحاذق بالدلالة.</div><div class='hd'>٤- عن ابن عباس رضي الله عنهما في رقية اللديغ بفاتحة الكتاب على قطيع من الغنم، فقال ﷺ: «إِنَّ أَحَقَّ مَا أَخَذْتُمْ عَلَيْهِ أَجْرًا كِتَابُ اللهِ» (رواه البخاري) — دلت هذه الأحاديث من قوله وفعله ﷺ على مشروعية الإجارة.</div>"],
["٦. بيّن دليل الإجماع والقياس والمعقول على مشروعية الإجارة، وبمَ يُرد على المخالف؟ (ص ١٣٩-١٤٠)","<b>• الإجماع:</b> نقله ابن قدامة في المغني والكاساني في البدائع أن الأمة أجمعت على جواز الإجارة، إلا ما يحكى عن <b>عبد الرحمن بن الأصم</b> أنه قال: لا يجوز لأنه غرر (يعني أنه يعقد على منافع لم تُخلق). <b>والرد عليه:</b> أن هذا غلط لا يمنع انعقاد الإجماع الذي سبق في الأعصار منذ زمن الصحابة بلا نكير.<br><b>• القياس:</b> قياس عقد الإجارة على عقد البيع؛ فلما جاز العقد على الأعيان وجب جوازه على المنافع لأن حاجة الناس للمنافع كحاجتهم للأعيان.<br><b>• المعقول:</b> أن كل واحد لا يكون له دار مملوكة يسكنها أو أرض يزرعها أو دابة يركبها، وقد لا يمكنه تملكها بالشراء لعدم الثمن ولا بالهبة والإعارة؛ فشرع الإسلام لكل حاجة عقداً يختص بها: (البيع لتمليك العين بعوض، الهبة لتمليك العين بغير عوض، الإعارة لتمليك المنفعة بغير عوض، والإجارة لتمليك المنفعة بعوض)."],
["٧. ما أنواع عقد الإجارة باعتبار المعقود عليه؟ وما شروط كل نوع؟ (ص ١٤٠-١٤١)","ينقسم إلى نوعين:<br><b>النوع الأول: عقد الإجارة الوارد على منافع الأعيان:</b> وينقسم إلى ٣ أقسام: (إجارة العقار كالدور والأراضي، إجارة العروض كالملابس والأواني، إجارة الدواب). كما ينقسم إلى:<br>أ- <b>إجارة أعيان مرئية:</b> يشترط فيها ما يشترط لصحة عقد البيع.<br>ب- <b>إجارة أعيان موصوفة في الذمة:</b> يشترط لها ما يشترط <b>للسلم</b> (معلوم الجنس كحنطة، والنوع كحنطة سقية أو نحسية، والصفة كجيد أو وسط أو رديء، والقدر بالكيل أو الوزن أو العد أو الذرع حتى لا يقع تنازع).<br><b>النوع الثاني: عقد الإجارة الوارد على الأعمال:</b> كاستئجار أصحاب الحرف والصنائع، مثل إعطاء السلعة للخياط ليخيط ثوباً فيصير إجارة على العمل (<b>فإن كان الثوب من عند الخياط كان عقد استصناع</b>). وينقسم إلى:<br>أ- <b>أجير خاص:</b> يعمل لواحد.<br>ب- <b>أجير مشترك:</b> يعمل لعامة الناس."],
["٨. عرّف «التمليك» لغةً و«الملك» اصطلاحاً وعند القرافي مع شرح قيود التعريف. (ص ١٤٣-١٤٤)","<b>• التمليك لغة:</b> مصدر مَلَك، يدل على قوة في الشيء وصحة، والمِلك: كل ما يملك من مال.<br><b>• الملك اصطلاحاً:</b> اتصال شرعي بين الإنسان وبين شيء يكون مطلقاً لتصرفه فيه وحاجزاً عن تصرف غيره فيه.<br><b>• تعريف القرافي للملك:</b> حكم شرعي مقدر في العين أو المنفعة يقتضي تمكن من يضاف إليه من انتفاعه بالمملوك والعوض عنه من حيث هو كذلك.<br><b>• شرح التعريف:</b> (حكم شرعي) بالإجماع لأنه يتبع الأسباب الشرعية، (مقدر) يرجع إلى تعلق إذن الشرع وهو تعلق عدمي ليس وصفاً حقيقياً، (في العين أو المنفعة) لأن الأعيان تملك كالبيع والمنافع كالإجارات."],
["٩. عرّف «الإجارة المنتهية بالتمليك» باعتبارها مصطلحاً مركباً، وما المصطلحات التي تطلق عليها؟ (ص ١٤٤-١٤٥)","<b>• تعريفها كمصطلح مركب:</b><br>١- هي عقد إجارة يقترن بها وعد بتمليك العين المؤجرة إلى المستأجر في نهاية مدة الإجارة أو أثنائها.<br>٢- عقد بين طرفين يؤجر فيه أحدهما الآخر سلعة معينة مقابل أجرة معينة يدفعها المستأجر على أقساط خلال مدة محددة، تنتقل بعدها ملكية السلعة للمستأجر عند سداده لآخر قسط بعقد جديد.<br>٣- عقد تمليك لمنفعة من عين معلومة مدة معلومة يتبعه تمليك العين على صفة مخصوصة بعوض معلوم.<br><b>• المصطلحات التي تطلق عليها:</b> (١- البيع الإيجاري، ٢- الإيجار الساتر للبيع، ٣- الإيجار الذي ينقلب بيعاً، ٤- الإيجار المقترن بوعد بالبيع)."],
["١٠. كيف نشأ عقد الإجارة المنتهية بالتمليك وتطور في الغرب وفي الدول الإسلامية ومصر؟ (ص ١٤٦-١٤٧)","• نشأ في <b>إنجلترا عام ١٨٤٦م</b> وأول من تعامل به تاجر للآلات الموسيقية كان يؤجر آلاته إجارة يتبعها تمليك.<br>• انتقلت الفكرة للشركات والمصانع فعملت بها <b>شركة سنجر لآلات الخياطة</b>.<br>• تناوله فقهاء القانون تحت مسميات الإيجار الساتر للبيع أو البيع الإيجاري أو الإيجار المملِّك، كما في المادة (٤٣٠) من القانون المدني المصري.<br>• انتقل للدول الإسلامية عبر البنوك الإسلامية، ومن أوائلها <b>بنك ماليزيا الإسلامي</b>.<br>• وفي مصر قام <b>بنك مصر إيران للتنمية</b> بالاشتراك مع هيئة سوق المال وهيئة التمويل الدولية وشركة (مانوفاكتشورز ليسينج الأمريكية) بتأسيس أول شركة تأجير مالي في مصر."],
["١١. ما أهم الفروق بين عقدي البيع والإجارة التشغيلية؟ وبمَ يتميز عقد الإجارة المنتهية بالتمليك عنهما؟ (ص ١٤٩-١٥٠)","<b>أولاً: الفروق بين البيع والإجارة التشغيلية:</b><br>١- كلاهما من العقود اللازمة، إلا أن البيع يرد على العين ومنفعتها، بينما الإجارة تنتقل فيها ملكية المنفعة فقط للمستأجر وتبقى العين على ملك المؤجر.<br>٢- في الإجارة لا يلتزم المستأجر بشراء العين.<br>٣- المخاطر ونفقاتها من مسؤولية المؤجر بدون خلاف.<br>٤- مدة الإجارة التشغيلية قد تقصر كثيراً عن العمر الإنتاجي للأصل.<br>٥- الأعيان في الإجارة التشغيلية تعود لحيازة البنك المؤجر بعد انتهاء العقد فيتحمل المالك مخاطر ركود السوق وانخفاض الطلب.<br><b>ثانياً: ما يتميز به عقد الإجارة المنتهية بالتمليك عنهما:</b><br>١- عقد مركب يجمع بين الإيجار والوعد بالبيع، ويلتزم المستأجر بسداد الأقساط وإلا قد يتعرض لخسارة ما دفعه.<br>٢- ينتهي في معظم صوره بتملك المستأجر للعين (بوعد أو عقد، بدون ثمن أو بثمن رمزي أو حقيقي أو بسعر السوق أو بالتخيير).<br>٣- مدة الإيجار قد تصل أو تقارب العمر الإنتاجي للسلعة."],
["١٢. وضح الفروق الثلاثة الجوهرية بين الإجارة المنتهية بالتمليك والبيع بالتقسيط. (سؤال كتاب وامتحانات - ص ١٥٠-١٥١)","<b>١- من حيث انتقال الملكية:</b> البيع بالتقسيط عقد تنتقل فيه ملكية العين إلى المشتري بمجرد إبرام العقد وله حرية التصرف في المبيع وهو عقد واحد لا يتجدد، بخلاف الإجارة المنتهية بالتمليك فلا تنتقل الملكية إلا بعد انتهاء الإجارة وإبرام عقد التمليك.<br><b>٢- من حيث استقرار الأقساط:</b> في البيع بالتقسيط تعتبر الأقساط ديناً لازماً في ذمة المشتري بعد إبرام العقد، أما في الإجارة المنتهية بالتمليك فتعد دفعات الإجارة ديوناً غير مستقرة إلا بعد التمكن من استيفاء المنفعة.<br><b>٣- من حيث تداول الحق وتصكيكه:</b> في البيع بالتقسيط تثبت ملكية البائع بعد البيع للدين الذي في ذمة المشتري، ولذا <b>لا يجوز بيع هذا الدين ولا تصكيكه</b> لأنه من تداول الديون، بينما في الإجارة المنتهية بالتمليك تبقى ملكية المؤجر للأعيان المؤجرة ولذا <b>يجوز تصكيك هذا الحق</b>."],
["١٣. اذكر مزايا عقد الإجارة المنتهية بالتمليك بالنسبة للمستأجر (ثماني مزايا). (ص ١٥٢-١٥٣)","١- حيازة المستأجر للأصل والاستفادة منه بالرغم من عدم قدرته على دفع الثمن نقداً.<br>٢- عدم الحاجة إلى تجميد جزء كبير من رأس ماله مما يحسن مركز السيولة لديه.<br>٣- اقتناء معدات حديثة قد لا تتوافر له إمكانية شرائها لضعف موارده الذاتية.<br>٤- يقدم تمويلاً كاملاً للأصول المستأجرة (لا يتطلب دفع جزء من الثمن مقدماً).<br>٥- تفادي القيود البنكية، وهو أفضل من الاقتراض بالفوائد الربوية المحرمة.<br>٦- عدم التعرض لمخاطر التمويل عن طريق الاقتراض.<br>٧- <b>ميزة ضريبية:</b> تجنب الضرائب؛ حيث يتم خصم قيمة الأقساط الإيجارية من أرباح المستأجر وصولاً إلى صافي الربح الخاضع للضريبة.<br>٨- <b>ميزة محاسبية في الميزانية:</b> عدم إرهاق المستأجر بالديون؛ فلا تظهر قيمة الأصل ولا القروض في جانب الخصوم بالميزانية، وإنما تنعكس الأقساط في حساب الأرباح والخسائر كبند من بنود المصروفات فلا تتأثر النسب التحليلية للمركز المالي."],
["١٤. اذكر مزايا عقد الإجارة المنتهية بالتمليك بالنسبة للمؤجر وبالنسبة للاقتصاد القومي. (سؤال كتاب - ص ١٥٣-١٥٤)","<b>أولاً: بالنسبة للمؤجر (٥ مزايا):</b><br>١- يحمّل المستأجر تكاليف الصيانة التشغيلية اللازمة للمحافظة على الأصول.<br>٢- يحتفظ بحق الرقابة بحيث يمكنه استرجاع الأصل في حالة عدم سداد المستأجر لباقي الأقساط.<br>٣- <b>عدم مزاحمة الغرماء في العين المؤجرة في حالة إعسار المستأجر (إفلاسه)</b>؛ فتعود له العين ولا تدخل في المحاصة لأنها على ملك المؤجر.<br>٤- توفر شروط التعاقد مرونة كبيرة في اختيار العميل.<br>٥- بتمليك المعدات للمستأجر بعد سداد الأقساط يوفر على المؤسسة المالية تكاليف تفكيك المعدات وإرجاعها إليها.<br><b>ثانياً: بالنسبة للاقتصاد القومي (٣ مزايا):</b><br>١- إتاحة الأصول والمعدات مما يساعد على إنشاء مزيد من المشروعات الإنتاجية والتوسع في الوحدات القائمة وإحداث التنمية الاقتصادية.<br>٢- زيادة فرص تشغيل العمالة في المجتمع، وهو ما يحد من البطالة.<br>٣- التعجيل بإقامة صناعات متقدمة أكثر إنتاجية."],

"الوحدة الثانية: صور الإجارة المنتهية بالتمليك والمسائل الفقهية التي ينبني عليها العقد (ص ١٥٥ - ١٧٩)",
["١٥. اشرح الصورة الأولى والثانية من صور صياغة عقد الإجارة المنتهية بالتمليك. (ص ١٥٦-١٥٨)","<b>• الصورة الأولى (التمليك تلقائياً بدون ثمن سوى الأقساط):</b> أن يصاغ العقد على أنه إجارة ينتهي بتملك الشيء المؤجر مقابل ثمن يتمثل في المبالغ التي دفعت فعلاً كأقساط إيجار، فيصبح المستأجر مالكاً للشيء تلقائياً بمجرد سداد القسط الأخير دون حاجة لإبرام عقد جديد. <b>صياغتها:</b> (أجرتك هذه السلعة بأجرة كذا لمدة ثلاث سنوات، على أنك إذا وفيت بهذه الأقساط كان الشيء ملكاً لك مقابل ما دفعته، ويقول الآخر قبلت).<br><b>• الصورة الثانية (بثمن رمزي أو حقيقي):</b> إجارة تمكن المستأجر من الانتفاع بالعين في مدة محددة، على أن يكون للمستأجر الحق في تملك العين في نهاية المدة مقابل دفع مبلغ هو كذا (ثمن رمزي أو حقيقي). وقد وضع الثمن الرمزي لهدفين: (١- إظهار الاتفاق بأنه في البداية إجارة، ٢- أنه في النهاية بيع). وتشتمل هذه الصورة على عقدين: (<b>الأول:</b> عقد إجارة ناجز اقترن به شرط فاسخ، <b>والثاني:</b> عقد بيع معلق على شرط)."],
["١٦. اشرح الصورة الثالثة والرابعة والخامسة من صور عقد الإجارة المنتهية بالتمليك. (ص ١٥٨-١٥٩)","<b>• الصورة الثالثة (إجارة مقترنة بوعد بالبيع):</b> أن يصاغ العقد على أنه إجارة، على أن المؤجر يعد المستأجر وعداً ملزماً -إذا وفى بسداد الأقساط في المدة المحددة- ببيع العين المؤجرة في نهاية العقد بمبلغ معين.<br><b>• الصورة الرابعة (إجارة مقترنة بوعد بهبة العين):</b> أن يصاغ العقد على أنه إجارة، على أن المؤجر يعد وعداً ملزماً بهبة العين للمستأجر في نهاية العقد إذا وفى بسداد الأقساط الإيجارية.<br><b>• الصورة الخامسة (إجارة مقترنة بوعد بالتخيير):</b> عقد إجارة مع وعد ملزم من المؤجر بأن يجعل للمستأجر في نهاية مدة الإجارة الحق في اختيار أحد ثلاثة أمور:<br>١- تملك السلعة مقابل ثمن يراعى في تحديده المبالغ التي دفعها كأقساط (محدد عند بداية التعاقد أو بأسعار السوق عند نهايته).<br>٢- مدّ عقد الإجارة لفترة أخرى.<br>٣- إعادة الأعيان المؤجرة إلى المؤسسة المالكة والمؤجرة لها."],
["١٧. المسألة الأولى: اذكر آراء الفقهاء في حكم اجتماع البيع والإجارة في عقد واحد، وما شرط ابن القاسم؟ وما سبب الخلاف؟ (ص ١٦٠-١٦١)","<b>• معنى المسألة:</b> أن يتراضى العاقدان على إبرام معاملة تشتمل على عقدي البيع والإجارة بحيث تعتبر موجباتهما جملة واحدة.<br><b>• الرأي الأول (الجواز):</b> يجوز اجتماع البيع والإجارة في عقد واحد سواء كان محل العقد واحداً أو مختلفاً بثمن واحد، وهو قول <b>جمهور المالكية (عدا سحنون)، وأصح القولين عند الشافعية، والمذهب عند الحنابلة، وبه قال شيخ الإسلام ابن تيمية</b>.<br>— <b>شرط ابن القاسم في روايته عن مالك:</b> اشترط في اجتماعهما في عين واحدة في إجارة الأعمال أن يعرف وجه خروج هذا العمل على أي وجه كان من كونه رديئاً أو جيداً، أو يمكن إعادته إن لم يرضَ به المؤجر.<br><b>• الرأي الثاني (المنع):</b> عدم جواز اجتماع البيع والإجارة في عقد واحد، وهو قول <b>الحنفية، والشافعية في وجه، ورواية للحنابلة، ووافقهم سحنون من المالكية فيما إذا كان محل العقد واحداً في الإجارة على الأعمال</b> (أما إذا اختلف المحل جاز عند سحنون).<br><b>• سبب الخلاف:</b> التردد في فهم حديث «النهي عن بيعتين في بيعة» بين العمل بمفهومه (المنع إذا أفضى لربا أو غرر فحملوه على الجواز هنا) أو العمل بظاهره (منع اجتماع العقود في صفقة واحدة)."],
["١٨. اذكر أدلة المجيزين والمانعين لاجتماع البيع والإجارة في عقد واحد مع المناقشة والترجيح. (ص ١٦٢-١٦٦)","<b>• أدلة الرأي الأول (المجيزين) من المعقول:</b> (١- الأصل في العقود والشروط الجواز والصحة إلا ما دل الشرع على تحريمه، ٢- الأصل رضا المتعاقدين، ٣- كل منهما عقد يصح إفراده فصح جمعهما، ٤- اختلاف حكمهما لا يمنع صحة العقد ويقسم العوض عليهما).<br><b>• أدلة الرأي الثاني (المانعين):</b><br>— <b>من السنة:</b> حديث أبي هريرة «نهى رسول الله ﷺ عن بيعتين في بيعة»، وحديث عبد الله بن عمرو «لا يحل سلف وبيع ولا شرطان في بيع ولا ربح ما لم يضمن ولا بيع ما ليس عندك». <b>ونوقش:</b> بأن المراد ألا يجمع بين معاوضة وتبرع (كسلف وبيع)، وأن بيعتين في بيعة بيع السلعة بثمنين عاجل وآجل.<br>— <b>من المعقول:</b> أنه يتضمن زيادة منفعة مشروطة (ربا)، ولأن حكمهما مختلف (البيع فيه خيار ولا ينفسخ بتلف العين بخلاف الإجارة). <b>ونوقش:</b> بأنه يصح جمع ما فيه شفعة وما لا شفعة فيه رغم اختلاف حكمهما.<br><b>• الراجح وشروطه:</b> رجحان الرأي الأول (الجواز) للتيسير، ويشترط لذلك في إجارة الأعمال: (١- تحديد مدة الإجارة، ٢- الشروع في العمل أو تأخيره ثلاثة أيام، ٣- العلم بصفة العمل). <b>استدراك هام:</b> الصورة التي أجازها الفقهاء هي إجارة باتة ناجزة وبيع بات ناجز ليس معلقاً على شرط، فلا يصح قياس الإجارة المنتهية بالتمليك تلقائياً عليها لأن البيع فيها معلق على شرط والتمليكات لا تقبل التعليق."],
["١٩. المسألة الثانية: ما حكم ضمان العين المؤجرة وإلزام المستأجر بنفقات الصيانة والتأمين عند المتقدمين والمعاصرين؟ (ص ١٦٦-١٦٩)","<b>• عند الفقهاء المتقدمين:</b><br>١- اتفق الجمهور على أن يد المستأجر على العين المؤجرة <b>يد أمانة</b>، فإذا تلفت بلا تعد أو تقصير لم يضمنها؛ لحديث جابر: «لو بعت من أخيك ثمراً فأصابته جائحة فلا يحل لك أن تأخذ منه شيئاً»، ولأنه قبضها ليستوفي منفعتها.<br>٢- اتفق الجمهور على أنه <b>لا يجوز للمؤجر اشتراط الضمان أو صيانة العين على المستأجر وإلا فسدت الإجارة</b>؛ لأن تكاليف الضمان والصيانة مجهولة فتؤدي لجهالة الأجرة.<br>٣- <b>وخالف الزيدية:</b> فذهبوا إلى أن المستأجر ضامن للعين المؤجرة عملاً بحديث سمرة: «على اليد ما أخذت حتى تؤدي».<br><b>• عند العلماء المعاصرين وقرار المجمع رقم ١١٠ (١٢/٤):</b><br>١- ذهب أكثر المعاصرين (وهبة الزحيلي، القرة داغي، الألفي) إلى أن <b>نفقات الصيانة غير التشغيلية والتأمين لا تجب على المستأجر وإنما تجب على المؤجر</b>، وللمؤجر أن يوكل المستأجر فيها ثم يخصمها من الأجرة (فإن قام بها المستأجر دون إذن المؤجر اعتبر متبرعاً).<br>٢- أجاز د. منذر قحف ود. القرة داغي اشتراط الصيانة الجوهرية والتأمين المعلوم على المستأجر عند التعاقد كجزء من الأجرة ما لم يكن مجهولاً كانهدام جدار أو سقف.<br>٣- <b>قرار المجمع:</b> الصيانة التي يتوقف عليها استيفاء المنفعة تلزم المؤجر ولا يجوز اشتراطها على المستأجر، أما الصيانة التي لا يتوقف عليها استيفاء المنفعة فيجوز اشتراطها على أي منهما إذا عُينت تعييناً نافياً للجهالة."],
["٢٠. المسألة الثالثة: ما حكم بيع المؤجر العين المؤجرة للمستأجر؟ وما أثر ذلك على عقد الإجارة مع الأدلة والترجيح؟ (ص ١٦٩-١٧٢)","<b>• حكم البيع:</b> لا خلاف بين الفقهاء على <b>صحة بيع المؤجر العين المؤجرة للمستأجر</b>؛ لأن العين في يده لا حائل دونها (كما لو باع المغصوب من الغاصب)، ولأن ملك الرقبة حق خالص للبائع.<br><b>• أثر ذلك على عقد الإجارة (خلاف على رأيين):</b><br><b>١- الرأي الأول (عدم انفساخ الإجارة):</b> يستوفي المستأجر المنفعة بالإجارة إلى انتهاء مدتها ثم يتملكها بالبيع، فإن تلفت المنافع قبل انقضاء المدة انفسخت ورجع المشتري بالأجرة لما بقي. وهو قول <b>المالكية (بشرط ألا يبقى من المدة ما يكون غرراً)، والشافعية في الأصح، ورواية للحنابلة</b>. <b>دليلهم:</b> أن المستأجر ملك المنافع أولاً ملكاً مستقراً فلا يبطل بملك الرقبة، كما يملك الثمرة بعقد ثم يملك الأصل بعقد آخر.<br><b>٢- الرأي الثاني (انفساخ الإجارة - وهو الراجح):</b> تنفسخ الإجارة فيما بقي من المدة ويسقط عن المشتري الأجر فيما بقي. وهو قول <b>جمهور الحنفية، وبعض المالكية، والشافعية في وجه، والحنابلة في رواية</b>.<br>— <b>أدلتهم:</b> (١- قياس فسخ الإجارة بملك العين على فسخ النكاح بملك اليمين، ٢- المعقول: أنه إذا ملك الرقبة حدثت منافعها على ملكه فلم يبق عقد الإجارة، ويسقط الأجر كما لو تلفت العين)."],
["٢١. المسألة الرابعة: اذكر الآراء الأربعة للفقهاء في حكم الوفاء بالوعد. (ص ١٧٢-١٧٤)","<b>• الرأي الأول:</b> الوفاء بالوعد <b>مستحب</b> فلو تركه فاته الفضل وارتكب المكروه كراهة تنزيهية شديدة لكن لا يأثم. وبه قال <b>جمهور الحنفية (إذا لم يكن معلقاً)، وبعض المالكية، والشافعية، والحنابلة في رواية، والظاهرية</b>. (وقال <b>الحنفية</b> بلزوم الوفاء بالوعد إذا كان معلقاً بشرط، كقوله: بع هذا الشيء لفلان وإن لم يعطك الثمن فأنا أعطيه لك).<br><b>• الرأي الثاني:</b> <b>وجوب الوفاء بالوعد قضاءً إذا ارتبط بسبب ودخل الموعود في السبب</b>، أما إذا لم يباشر السبب فلا شيء على الواعد (كقوله: اهدم دارك أو تزوج وأنا أسلفك فهدم أو تزوج). وهو <b>القول المشهور والراجح في مذهب مالك (مالك وابن القاسم وسحنون)</b>.<br><b>• الرأي الثالث:</b> <b>وجوب الوفاء بالوعد قضاءً إذا ارتبط بسبب، سواء دخل الموعود في السبب أم لم يدخل فيه</b>، وبه قال <b>أصبغ</b> من فقهاء المالكية.<br><b>• الرأي الرابع:</b> <b>الوفاء بالوعد واجب مطلقاً إلا لعذر</b>، وهو قول بعض المالكية (<b>ابن العربي</b>)، و<b>الإمام أحمد في رواية ثانية</b>، وقول بعض السلف (<b>عمر بن عبد العزيز، إسحاق بن راهويه، ابن شبرمة، والإمام الغزالي</b>)."],
["٢٢. اذكر أدلة الآراء الأربعة في حكم الوفاء بالوعد مع المناقشة وبيان الرأي الراجح. (ص ١٧٤-١٧٩)","<b>• أدلة الرأي الأول:</b><br>١- حديث زيد بن أرقم: «إِذَا وَعَدَ الرَّجُلُ أَخَاهُ وَمِنْ نِيَّتِهِ أَنْ يَفِيَ لَهُ فَلَمْ يَفِ وَلَمْ يَجِئْ لِلْمِيعَادِ فَلَا إِثْمَ عَلَيْهِ» (أبو داود والترمذي).<br>٢- حديث صفوان بن سليم أن رجلاً قال: يا رسول الله أكذب امرأتي؟ قال: «لا خير في الكذب» قال: أعدها وأقول لها، قال: «لا جناح عليك» (رواه مالك في الموطأ). <b>ونوقش:</b> بأنه محمول على من لم يفِ مضطراً لعذر.<br>٣- <b>ودليل الحنفية في لزوم المعلق:</b> لقوة الارتباط بين الشرط والجزاء كقوة الارتباط بين العلة والمعلول.<br><b>• دليل الرأي الثاني (المشهور عند المالكية):</b> الجمع بين النصوص المتعارضة بحمل آيات الذم على من أخلف سجية أو تعمداً أو أضر بالموعود الذي باشر السبب.<br><b>• دليل الرأي الثالث (أصبغ):</b> أن ذكر السبب مرتبطاً بالوعد يتأكد به العزم على الدفع.<br><b>• أدلة الرأي الرابع (الوجوب مطلقاً):</b> قوله تعالى: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لِمَ تَقُولُونَ مَا لَا تَفْعَلُونَ﴾ [الصف: ٢]، وحديث أبي هريرة: «آيَةُ الْمُنَافِقِ ثَلَاثٌ: إِذَا حَدَّثَ كَذَبَ، وَإِذَا وَعَدَ أَخْلَفَ، وَإِذَا اؤْتُمِنَ خَانَ» (البخاري)، وحديث ابن عباس: «لا تُمارِ أخاك ولا تمازحه ولا تعده موعداً فتخلفه» (الترمذي). (وردّ ابن حزم بأن الذم لمن أخلف في الأمور الواجبة، وأن من وعد بمعصية فلا يحل له الوفاء).<br><b>• الرأي الراجح في الكتاب:</b> وجوب الوفاء بالوعد مطلقاً إلا لعذر، <b>ويُجبر الواعد على الوفاء بوعده قضاءً إذا ترتب عليه ضرر يلحق بالموعود</b> جمعاً بين الأدلة."],

"الوحدة الثالثة: التكييف الفقهي والحكم الشرعي لصور الإجارة المنتهية بالتمليك (ص ١٨٠ - ٢١٥)",
["٢٣. ما المآخذ الثلاثة على الصورة الأولى (الإجارة المنتهية بالتمليك تلقائياً)؟ وما آراء المعاصرين في تكييفها الفقهي؟ (ص ١٨١-١٨٤)","<b>أولاً: المآخذ الثلاثة على صياغتها:</b><br>١- أن كل مبيع لا بد له من ثمن، وفي هذه الصورة لا يوجد ثمن وقت تمام البيع، وتحويل الأقساط السابقة إلى ثمن للعين بعقد لاحق لا يسير مع القواعد الشرعية في أن لكل عقد أحكامه وآثاره فور انعقاده.<br>٢- أن أجرة المنفعة لتلك السلعة ليست أجرة المثل، بل روعي فيها أن تكون ثمناً للسلعة.<br>٣- أن إرادة المتعاقدين متجهة إلى بيع هذه السلعة وليس إجارتها.<br><b>ثانياً: التكييف الفقهي لها (رأيان للمعاصرين):</b><br><b>• الرأي الأول:</b> أنها <b>عقد بيع بالتقسيط</b> (د. عبد الله محمد عبد الله، د. رفيق يونس المصري، الشيخ إبراهيم أبو الليل، د. شوقي أحمد دنيا)؛ لأن آثارها الملكية والأقساط موزعة كثمن مؤجل وإنما صيغت كإجارة خوفاً من نكول المشتري.<br><b>• الرأي الثاني:</b> أنها <b>تشتمل على عقدين: عقد إجارة، وعقد بيع معلق على سداد الأجرة</b> (د. يوسف الشبيلي، د. حسن الشاذلي، الشيخ عبد الله بن بيه). واعترض عليه بأن الأقساط دفعت كأجرة فكيف تتحول لثمن في نهاية المدة؟"],
["٢٤. ما آراء العلماء المعاصرين في الحكم الشرعي للصورة الأولى (الإجارة المنتهية بالتمليك تلقائياً دون عقد جديد) مع ذكر الأدلة بالتفصيل؟ (سؤال كتاب - ص ١٨٤-١٨٩)","اختلف المعاصرون في حكمها على رأيين:<br><b>• الرأي الأول (عدم الجواز - وهو الراجح):</b> قول أكثر المعاصرين (د. عبد الله محمد، د. حسن الشاذلي، الشيخ عبد الله بن بيه، د. وهبة الزحيلي، د. سعد الخثلان، الشيخ حامد العلي، د. خالد المشيقح) وهو ما قرره <b>مجمع الفقه الإسلامي وأفتت به اللجنة الدائمة</b>.<br>— <b>أدلتهم الستة:</b><br>١- اشتمالها على بيع وإجارة في آن واحد على عين واحدة، وقد نهى ﷺ عن «بيعتين في بيعة» وعن «شرطين في بيع».<br>٢- تناقض أحكام العقدين؛ فالبيع ينقل الملكية والضمان للمشتري، والإجارة تبقي الملك والضمان على المؤجر، فكيف يجمع على المستأجر ضمان التلف مع سحب السلعة منه إذا قصر؟<br>٣- أنه عقد <b>غرر ومجازفة</b>؛ فقد يعسر المشتري في آخر قسط وقد دفع أقساطاً تفوق أجرة المثل، فيخسر الثمن والمثمن معاً ويربحهما البائع، والأصل ألا يجتمع العوضان لشخص واحد.<br>٤- أدى إلى تساهل الفقراء في الديون وإفلاس بعض الدائنين.<br>٥- إبهام حقيقة العقد هل هو بيع أم إجارة، وتحويل الأجرة لثمن لاحقاً يخالف القواعد.<br>٦- أنه حيلة على البيع بالتقسيط، والأصل بناء العقود على الوضوح.<br><b>• الرأي الثاني (الجواز):</b> أفتى به الشيخ محمد بن جبير، ود. محمد جبر الألفي، ود. سعد بن ناصر الشثري.<br>— <b>أدلتهم الثلاثة:</b><br>١- العبرة في العقود بالحقائق والمقاصد، فهو في حقيقته بيع بالتقسيط والإجارة صورية.<br>٢- أنه بيع أدرج فيه شرط جزائي (عدم انتقال الملكية إلا بعد الوفاء بالأقساط) بناءً على رواية عن أحمد بجواز تعليق البيع على شرط.<br>٣- أنه لا يخرج عن كونه عقد بيع بأقساط مؤجلة ورهن للعين حتى يسدد كامل الثمن."],
["٢٥. ما الترجيح في الصورة الأولى (الإجارة المنتهية بالتمليك تلقائياً)؟ وما الشروط الخمسة للبديل والمخرج الشرعي ودليله من السنة؟ (ص ١٩٠-١٩٣)","<b>• الراجح:</b> رجحان الرأي الأول القائل <b>بعدم جواز عقد الإجارة المنتهية بالتمليك تلقائياً</b> بتلك الصيغة.<br><b>• البديل الشرعي وشروطه الخمسة:</b> أن يُفصل بين العقدين بحيث يستقل كل منهما عن الآخر وفق الشروط الآتية:<br>١- <b>ضمان العين:</b> يكون على المؤجر المالك لها (إلا في التعدي أو التقصير من المستأجر)، ونفقات التشغيل (كالزيت والبنزين) على المستأجر.<br>٢- <b>الشرط الجزائي:</b> للمؤجر اشتراط شرط جزائي تعويضاً له عن الضرر الفعلي عند عدم سداد الأقساط بقدر ما يرفع الضرر.<br>٣- <b>التأمين:</b> يجب أن يكون تعاونياً إسلامياً لا تجارياً.<br>٤- <b>صياغته كبيع معلق على الوفاء بالثمن:</b> فإذا لم يفِ بالأقساط استرد المالك العين على أن يخصم القيمة الحقيقية لإجارة العين في المدة السابقة ويرد على المشتري ما زاد على ذلك (الفرق بين ثمن المنفعة وثمن العين) عملاً بقاعدة «لا ضرر ولا ضرار».<br>٥- <b>أو إضافة وعد بالتمليك</b> في نهاية مدة الإجارة.<br><b>• الدليل من السنة على المخرج الشرعي:</b> حديث أبي هريرة رضي الله عنه في عامل خيبر الذي جاء بتمر جنيب (صاع بصاعين) فقال له النبي ﷺ: «أَوَكُلُّ تَمْرِ خَيْبَرَ هَكَذَا؟... لَا تَفْعَلْ، بِعِ الْجَمْعَ بِالدَّرَاهِمِ ثُمَّ ابْتَعْ بِالدَّرَاهِمِ جَنِيبًا» (متفق عليه)، فالأولى ممنوعة والثانية جائزة رغم اتحاد النتيجة، وهو ما أقره مجمع الفقه الإسلامي."],
["٢٦. ما حكم البيع بأقل من ثمن المثل (بثمن رمزي)؟ وما حكم الغبن لغير البصير بالقيمة؟ وما حكم الصورة الثانية (الإجارة المنتهية بالتمليك بثمن رمزي أو حقيقي)؟ (ص ١٩٣-٢٠٢)","<b>أولاً: حكم البيع بثمن رمزي والغبن في الفقه:</b><br>• لا خلاف بين جمهور الفقهاء (الأئمة الأربعة) في صحة البيع بثمن المثل أو أقل بكثير (كبيع ياقوتة تساوي مائة بدرهم) إذا صدر من أهل للتصرف (بالغ عاقل مختار رشيد) وعرفا الثمن الحقيقي ورضيا؛ لقوله تعالى: ﴿تِجَارَةً عَن تَرَاضٍ مِّنكُمْ﴾.<br>• <b>أما من باع سلعته وهو غير بصير بقيمتها (الغبن):</b> فذهب الجمهور (أبو حنيفة ومالك والشافعي) إلى أنه لا خيار له بالغبن، بينما المشهور عند <b>المالكية والحنابلة</b> أن له القيام بالغبن غير المعتاد <b>وحدوده الثلث فأكثر</b>.<br><b>ثانياً: حكم الإجارة المنتهية بالتمليك بثمن رمزي (رأيان للمعاصرين):</b><br><b>• الرأي الأول (عدم الجواز):</b> د. منذر قحف، د. حسن الشاذلي، وغالب هيئة كبار العلماء؛ لورود عقدين على عين واحدة في وقت واحد، وللغرر لأن العين قد تتغير بالاستخدام عند نفاذ البيع المؤجل.<br><b>• الرأي الثاني (الصحة والجواز بشروط - وهو الراجح):</b> الشيخ عبد الله بن منيع، د. محمد مختار السلامي، د. وهبة الزحيلي، والهيئة الشرعية لشركة الراجحي ومجموعة دلة البركة. <b>بشرط أن يكون عقد البيع منفصلاً عن عقد الإجارة</b> (في أثنائها أو بعد انتهائها).<br>— <b>شرط د. السلامي:</b> تقديم الثمن الرمزي حالاً وناجزاً حتى لا يؤول إلى تعمير ذمتين الممنوع شرعاً.<br>— <b>شرط د. وهبة الزحيلي (وبمثله أفتت هيئة بيت التمويل الكويتي):</b> أخذ موافقة الجمعية العمومية للمساهمين أو أصحاب صناديق الاستثمار على البيع بسعر رمزي أو الهبة.<br><b>ثالثاً: حكم الإجارة المنتهية بالتمليك بثمن حقيقي:</b> صحيحة بالاتفاق إذا تضمنت وعداً بالبيع من المؤجر ووعداً بالشراء من المستأجر وبُرم البيع مستقلاً في النهاية."],
["٢٧. ما التكييف والحكم الشرعي للصورة الثالثة (الإجارة المقرونة بوعد بالبيع)؟ وما الخطوات الأربع العملية لإبرام العقد؟ (ص ٢٠٢-٢٠٥)","<b>• التكييف الفقهي:</b> عقد إجارة عادي خلال كامل مدة العقد تسري عليه جميع أحكام الإجارة إلى حين تمليك المستأجر للعين (كما في فتوى ندوة البركة).<br><b>• الحكم الشرعي:</b> يبنى على الراجح من وجوب الوفاء بالوعد ديانةً وقضاءً إذا دخل الموعود في كلفة، فتكون هذه الصورة <b>جائزة شرعاً</b> وأقرها مجمع الفقه الإسلامي في دورته الثانية عشرة بالرياض (١٤٢١هـ / ٢٠٠٠م)، <b>بشرط وجود صيغة جديدة (إيجاب وقبول) تصدر عند الانتهاء لنقل الملكية</b> بحيث يكون عقد البيع منفصلاً عن عقد الإجارة.<br><b>• الخطوات الأربع العملية لإبرام العقد:</b><br>١- عقد شراء العين من المورد أو بتوكيل سابق مستقل للراغب في الاستئجار.<br>٢- يبرم عقد إجارة بشكله المستقل.<br>٣- بشكل متوازٍ مع إبرام عقد الإجارة يتم اتفاق الطرفين على كيفية نقل ملكية العين للمستأجر في نهاية الإجارة بوثيقة مستقلة (سواء بعقد الهبة المعلق أو بالوعد بالبيع بالسعر الرمزي أو المتفق عليه).<br>٤- تنفيذ عملية نقل الملكية بإيجاب وقبول يصدر من الطرفين في حالة وثيقة عقد الإجارة إذا اشتملت على وعد ببيع الأعيان المؤجرة."],
["٢٨. ما صورتا الإجارة المنتهية بالتمليك عن طريق الهبة (الصورة الرابعة)؟ وما خلاف الفقهاء في تعليق الهبة على شرط؟ وما الترجيح؟ (ص ٢٠٥-٢٠٩)","<b>• صورتاها:</b><br><b>الأولى:</b> إجارة مقترنة بوعد ملزم بهبة العين للمستأجر إذا وفى بالأقساط، وتنقل الملكية في النهاية بإيجاب وقبول (وهي جائزة وأقرها مجمع الفقه والندوة الفقهية الأولى لبيت التمويل الكويتي ١٩٨١م).<br><b>الثانية:</b> إجارة مع <b>عقد هبة فوري معلق على شرط سداد جميع الأقساط</b> (كقوله: إذا قمت بسداد جميع الأقساط في المدة المحددة فإني وهبتك هذه الدار).<br><b>• خلاف الفقهاء في تعليق الهبة على شرط مستقبل (رأيان):</b><br><b>١- الرأي الأول (عدم الجواز):</b> قول <b>جمهور الفقهاء من الحنفية والشافعية والحنابلة والظاهرية</b>؛ لأن الأصل في عقود التمليكات أن تكون منجزة كالبيع.<br><b>٢- الرأي الثاني (الجواز - وهو الراجح):</b> قول <b>بعض الحنفية، والمالكية، ورواية لأحمد، واختاره شيخ الإسلام ابن القيم في (إغاثة اللهفان)</b>.<br>— <b>أدلتهم من السنة:</b><div class='hd'>١- حديث أم سلمة رضي الله عنها أن النبي ﷺ قال لها: «إِنِّي قَدْ أَهْدَيْتُ إِلَى النَّجَاشِيِّ حُلَّةً وَأَوَاقِيَّ مِنْ مِسْكٍ، وَلَا أَرَى النَّجَاشِيَّ إِلَّا قَدْ مَاتَ، وَلَا أَرَى إِلَّا هَدِيَّتِي مَرْدُودَةً عَلَيَّ، فَإِنْ رُدَّتْ عَلَيَّ فَهِيَ لَكِ» (رواه أحمد).</div><div class='hd'>٢- حديث جابر رضي الله عنه قال: قال لي النبي ﷺ: «لَوْ قَدْ جَاءَ مَالُ الْبَحْرَيْنِ أَعْطَيْتُكَ هَكَذَا وَهَكَذَا وَهَكَذَا» (رواه البخاري) — ولأن الهبة من عقود التبرعات فللمتبرع أن يتبرع كيفما شاء، وبناءً عليه أجاز هذه الصورة مجمع الفقه الإسلامي.</div>"],
["٢٩. اذكر نص قرار مجمع الفقه الإسلامي رقم ١١٠ (١٢/٤) ورقم ٩٤ (١١/٦) وأهم الضوابط والنتائج الحاكمة للإجارة المنتهية بالتمليك. (ص ٢١٠-٢١٢)","<b>أولاً: ضابط المنع:</b> أن يرد عقدان مختلفان، في وقت واحد، على عين واحدة، في زمن واحد.<br><b>ثانياً: ضوابط الجواز وأهم النتائج:</b><br>١- وجود عقدين منفصلين يستقل كل منهما عن الآخر زماناً بحيث يكون إبرام البيع أو الهبة بعد عقد الإجارة، أو وجود وعد بالتمليك في نهاية مدة الإجارة، والخيار يوازي الوعد في الأحكام.<br>٢- أن تكون الإجارة فعلية حقيقية مستجمعة لأركانها وشروطها وليست ساترة للبيع.<br>٣- أن يكون ضمان العين المؤجرة على المالك لا على المستأجر (يد المستأجر يد أمانة)، فلا يلزم المستأجر بشيء إذا فاتت المنفعة بلا تعد أو تقصير منه.<br>٤- إذا اشتمل العقد على تأمين العين المؤجرة فيجب أن يكون التأمين تعاونياً إسلامياً لا تجارياً ويتحمله المالك المؤجر وليس المستأجر.<br>٥- تطبق أحكام الإجارة طوال مدة الإجارة (والأجرة المدفوعة تعتبر ثمناً للمنفعة لا يستردها المستأجر إن لم يتحقق التملك)، وتطبق أحكام البيع عند تملك العين.<br>٦- <b>قرار عقد الصيانة رقم ٩٤ (١١/٦):</b> الصيانة غير التشغيلية (التي يتوقف عليها استيفاء المنفعة) تلزم المؤجر طوال المدة ولا يجوز اشتراطها على المستأجر، أما الصيانة التشغيلية (أو التي لا يتوقف عليها استيفاء المنفعة) فيجوز اشتراطها على أي منهما إذا عُينت تعييناً نافياً للجهالة."],

"الموضوع الرابع: أحكام المناقصات في الفقه الإسلامي — الوحدة الأولى: مفهومها وإجراءاتها وأسسها وأنواعها (ص ٢١٦ - ٢٢٧)",
["٣٠. عرّف المناقصة لغةً واصطلاحاً، واشرح قيود التعريف الاصطلاحي بالتفصيل. (سؤال كتاب - ص ٢١٨-٢١٩)","<b>• المناقصة لغة:</b> يقال نقص الشيء نقصاً ونقصاناً، وانتقص المشتري الثمن أي استحط، والنقيصة: العيب، والنقص: الخسران في الحظ، وتناقص الشيء: نقص شيئاً فشيئاً. وهي عكس المزايدة، وهي تنافس في عرض أقل الأسعار.<br><b>• المناقصة اصطلاحاً:</b> هي إجراء بمقتضاه تلتزم الجهة المعلنة عنه بالتعاقد مع صاحب عرض العوض الأقل من عروض المتنافسين للفوز فيه، نظير الوفاء بما التزم به مطابقاً للشروط والمواصفات المقررة.<br><b>• شرح قيود التعريف:</b><br>١- <b>(إجراء):</b> يشمل كل إجراء تعاقدي أو غير تعاقدي.<br>٢- <b>(بمقتضاه تلتزم الجهة المعلنة عنه):</b> قيد يخرج كل إجراء لا يتضمن التزاماً، وإسناد الالتزام للجهة المعلنة بيان لأحد أركان المناقصة.<br>٣- <b>(بالتعاقد):</b> قيد يخرج كل إجراء يتضمن التزاماً مستقلاً عن إرادة الغير؛ لكون العقد ارتباطاً بين إرادتين.<br>٤- <b>(مع صاحب عرض العوض الأقل):</b> قيد يبين أنه من عقود المنافسة، وتقييده بالعوض الأقل <b>يخرج عقد المزايدة</b> ويعد ركناً من أركان المناقصة.<br>٥- <b>(نظير الوفاء بما التزم به مطابقاً للشروط والمواصفات):</b> يبين أن العوض مقابل ما التزم به من توريد أو مقاولة مطابقاً للمواصفات."],
["٣١. ما الفرق بين المناقصة والمزايدة؟ وما تعريف كلٍّ من «المقاولة» و«عقد التوريد»؟ (ص ٢١٩-٢٢٠)","<b>• الفرق بين المناقصة والمزايدة:</b> المزايدة يجريها البائعون لأنهم يريدون عقد البيع بأعلى سعر، أما المناقصة فتجريها الجهة المشترية أو المستأجرة لأنها ترغب في التعاقد بأقل سعر، وتختلف المناقصة عن الشراء المباشر بأن هناك إجراءات تسبقها وتمهد لها.<br><b>• تعريف المقاولة وتكييفها الشرعي:</b> أن يتعهد أحد المتعاقدين بأن يصنع شيئاً للطرف الثاني مقابل ثمن معين؛<br>— فإن تعهد المقاول بتقديم <b>العمل والمادة</b> كان مقاولة في العرف و<b>استصناعاً</b> في الشرع.<br>— وإن تعهد بتقديم <b>العمل فقط</b> كان مقاولة في العرف و<b>إجارة</b> في الشرع.<br><b>• تعريف عقد التوريد:</b> هو عقد بين جهة إدارية عامة ومنشأة خاصة (أو عامة) على توريد أصناف (سلع، مواد) محددة الأوصاف، في تواريخ معينة، لقاء ثمن معين، يدفع على نجوم (أقساط)."],
["٣٢. اشرح مرحلة التحضير والخطوات الست لإجراءات المناقصات بالترتيب. (سؤال كتاب - ص ٢٢٠-٢٢٢)","<b>أولاً: مرحلة التحضير قبل الإعلان:</b><br>تقدير القيمة التقريبية للتوريد أو المشروع، والتأكد من وجود الاعتماد المالي اللازم للموازنة، وتشكيل لجنة لوضع المواصفات والشروط (مثل شرط التسليم في محل البائع أو ميناء الشحن أو الوصول، وتحديد من يتحمل مصاريف الشحن والتفريغ والتأمين والرسوم الجمركية).<br><b>ثانياً: خطوات الدعوة والبت في المناقصة (٦ خطوات):</b><br>١- <b>الإعلان</b> في الصحف الكثيرة الانتشار (في المناقصة العامة) وتحديد الصنف أو العمل المطلوب وقيمة دفتر الشروط وآخر موعد.<br>٢- <b>شراء دفتر الشروط</b> الذي يحتوي على المعلومات التي أعدتها الجهة الإدارية.<br>٣- <b>تقديم العروض</b> في مظاريف مختومة (<b>بالشمع الأحمر</b>) وموقعة، ولا يجوز فتحها إلا في الموعد المحدد، وليس للمناقصين بعد تقديم عروضهم تعديل الأسعار بالزيادة أو النقصان حفاظاً على مبدأ المساواة والسرية.<br>٤- <b>تشكيل لجنة لفتح المظاريف</b> بعد التأكد من سلامة الأختام في موعد محدد بحضور المناقصين أو مندوبيهم.<br>٥- <b>تشكيل لجنة لفحص العروض</b> والتأكد من توافر الشروط الشكلية ومطابقتها للمواصفات.<br>٦- <b>تشكيل لجنة للبت في العروض</b> (التي استوفت الضمان الابتدائي وشهادة السجل التجاري والغرفة التجارية) واختيار العرض الأقل سعراً وإعداد محضر التوصية."],
["٣٣. ما المقصود بـ «مبدأ المنافسة» في المناقصات؟ وما فوائده الثلاث؟ (سؤال كتاب - ص ٢٢٢-٢٢٣)","<b>• مفهوم مبدأ المنافسة:</b> إتاحة الفرصة لكل من تتوافر فيه شروط المناقصة أن يتقدم بعطائه حتى يكون المجال مفتوحاً للإدارة في اختيار من تراه مناسباً، ويتطلب ضرورة الإعلان عن المناقصة وعدم منع أحد استوفى الشروط.<br><b>• فوائد الإعلان ومبدأ المنافسة (٣ فوائد):</b><br>١- تجنب الإدارة أجواء الشك والريبة في التعامل النزيه في إبرام العقود.<br>٢- إيجاد منافسة مشروعة بين الراغبين في التعاقد مما يؤدي إلى اختيار أفضل العقود.<br>٣- تأكيد مبدأ حرية التجارة والعمل والمساواة بين الأفراد في ذلك."],
["٣٤. اشرح المظاهر الثمانية لـ «مبدأ المساواة» الذي تقوم عليه المناقصات. (ص ٢٢٣-٢٢٤)","١- الإعلان عن المناقصة في صحف واسعة الانتشار حتى يعلم بها أكبر عدد ممكن.<br>٢- تجنب ذكر مواصفات أو شروط تنطبق على بلد أو مورد أو مقاول بعينه.<br>٣- منح الجميع مهلة كافية للتقدم بالعروض.<br>٤- عدم إجراء أي تعديل في الشروط أو المواصفات لمصلحة أحد المناقصين، ولا استبعاد عطاءات بقرارات فردية، وتوحيد معايير القبول والفحص للجميع.<br>٥- عدم العدول عن التعاقد مع صاحب العطاء الأقل سعراً إلا بقرار مسبب وواضح.<br>٦- المساواة بين الجميع في المعلومات والفرص والمواعيد وإجراءات التسليم والصرف والضمان والغرامة وسحب العمل.<br>٧- <b>في حالة التساوي بين عرضين أو أكثر:</b> يلجأ إلى التفاوض، فلو بقي التساوي قائماً بعد التفاوض تُقسم الكمية بينهما إذا أمكن ذلك، وإلا اختير أحدهما <b>بالقرعة</b>.<br>٨- وجود رقابة فعالة لمنع أي تجاوزات أو محاباة أو رشوة أو إفشاء للسرية."],
["٣٥. من هم أطراف المناقصة؟ وما أنواع المناقصات باعتباراتها الأربعة؟ وهل تؤثر في حكمها الشرعي؟ (ص ٢٢٤-٢٢٧)","<b>• أطراف المناقصة طرفان:</b><br>١- <b>الطرف الأول:</b> الجهة الإدارية (صاحبة المناقصة / المناقَص له) كالمصالح الحكومية أو الشركات.<br>٢- <b>الطرف الثاني:</b> الموردون أو المقاولون المشتركون في المناقصة (المناقِص).<br><b>• أنواع المناقصات (وهي تقسيمات لا تؤثر في تغيير الحكم الشرعي لها):</b><br><b>أولاً: باعتبار نظامها:</b><br>أ- <b>مناقصات عامة:</b> وهي الأصل، توجه فيها الدعوة لعدد غير محدود وتخضع للعلانية.<br>ب- <b>مناقصات محدودة:</b> توجه الدعوة فيها بالرسائل لعدد محدود ممن تتوافر فيهم الكفاءة وحسن السمعة، ويلجأ إليها استثناءً للاقتصاد في تكاليف المناقصات العامة.<br><b>ثانياً: باعتبار حدودها:</b> (أ- <b>مناقصة داخلية</b> تقتصر على داخل البلد، ب- <b>مناقصة خارجية</b> يشترك فيها موردون ومقاولون من خارج البلد).<br><b>ثالثاً: باعتبار طرق إجرائها:</b><br>أ- <b>مناقصات علنية:</b> يحضر المناقصون وتكون أسعارهم مكشوفة.<br>ب- <b>مناقصات سرية:</b> وهي السائدة حديثاً؛ لأن المناقصات الحديثة فنية معقدة تحتاج لدراسة، ولأنه قد يخشى في العلانية أن يندفع البعض بحرارة المنافسة للنزول إلى أسعار غير معقولة فيتعثر التوريد أو التنفيذ.<br><b>رابعاً: باعتبار موضوعها:</b> (أ- مناقصات موضوعها <b>الشراء</b>، ب- مناقصات موضوعها <b>الإجارة</b>، ج- مناقصات لأجل <b>الاستثمار</b> كالمضاربة والمزارعة والمساقاة)."],

"الوحدة الثانية: الأحكام الشرعية للمناقصات والبيوع المنهي عنها (ص ٢٢٨ - ٢٥٩)",
["٣٦. اذكر الآراء الخمسة للعلماء المعاصرين في التكييف الفقهي للمناقصات مع مناقشة كل رأي وبيان الرأي الراجح. (سؤال كتاب - ص ٢٢٩-٢٣٣)","<b>• الرأي الأول:</b> المناقصة <b>كالمزايدة</b> ينطبق عليها ما ينطبق على المزايدة والاختلاف في الشكل فقط (د. رفيق المصري في قول، د. علي السالوس، د. عبد الوهاب أبو سليمان، د. محمد المختار السلامي).<br><b>• الرأي الثاني:</b> المناقصة تشبه <b>عقد المسابقة</b> في الاسم والمضمون ويشترط فيها المساواة بين المشتركين (د. رفيق المصري في قول ثان).<br><b>• الرأي الثالث:</b> تختلف باختلاف موضوعها، فالدعوة للمناقصة دعوة إلى العقود التي تؤول إليها من بيع أو إجارة أو استصناع أو مضاربة، وهي مشروعة بأدلة البيع ﴿وَأَحَلَّ اللَّهُ الْبَيْعَ﴾، وتتعين في الشراء للأيتام والأوقاف والمؤسسات العامة لدفع التهمة (القاضي محمد تقي العثماني، والشيخ حسن الجواهري). <b>ونوقش:</b> بأن هذا تكييف لما تؤول إليه المناقصة وليس تكييفاً لذات المناقصة.<br><b>• الرأي الرابع:</b> المناقصة <b>منظومة عقود (عقد مركب)</b>؛ يدخل فيها عقد بيع دفتر الشروط، وعقد الضمان بنوعيه، وعقد التوريد أو المقاولة، فالإيجاب فيها يصدر من المناقِص عند تقديم العطاء وهو ملزم له، والقبول يصدر من المناقَص له عند إبرام العقد مع صاحب العطاء الأقل سعراً (د. رفيق المصري).<br><b>• الرأي الخامس:</b> المناقصة ما هي إلا <b>إجراءات للدخول في العقد وليست عقداً</b> وإنما سميت عقوداً تجوزاً (الشيخ عبد الله بن منيع، ود. القرة داغي). <b>ونوقش:</b> بأنها عقد تام مشتمل على إيجاب ملزم وقبول.<br><b>• الرأي الراجح:</b> أن أقرب التخريجات الفقهية للمناقصة:<br>١- أنها تشبه <b>عقد المزايدة</b> في الكثير من الإجراءات مع مراعاة التقابل (التضاد) بينهما.<br>٢- أنها <b>منظومة عقود</b> وليست عقداً واحداً (بيع كراسة الشروط + عقد الضمان + عقد التوريد أو المقاولة)."],
["٣٧. عرّف المزايدة لغةً واصطلاحاً (عند ابن جزي والزيلعي)، واذكر آراء الفقهاء الثلاثة في حكمها. (سؤال كتاب - ص ٢٣٣-٢٣٥)","<b>• المزايدة لغة:</b> نافسه في الزيادة وفي ثمن السلعة، والزاي والياء والدال أصل يدل على الفضل، والمزاد: موضع الزيادة. وبيع المزاد: البيع الذي يتم بطريق الدعوة إلى شراء الشيء المعروض ليرسو على من يعرض أعلى ثمن.<br><b>• المزايدة في اصطلاح الفقهاء:</b><br>— <b>عرفها ابن جزي:</b> أن ينادي على السلعة ويزيد الناس فيها بعضهم على بعض حتى تقف على آخر زائد فيها فيأخذها.<br>— <b>وعرفها الزيلعي:</b> أن يظهر من البائع ما يدل على عدم الرضا بالبيع فيأتي آخر فيزيد عليه.<br><b>• آراء الفقهاء في حكم بيع المزايدة (٣ آراء):</b><br>١- <b>الرأي الأول:</b> جواز بيع المزايدة مطلقاً، وهو قول <b>جمهور الفقهاء من الحنفية والمالكية والشافعية والحنابلة والظاهرية والزيدية</b>.<br>٢- <b>الرأي الثاني:</b> عدم جواز بيع المزايدة إلا فيما يحصل عليه عن طريق <b>الميراث والغنيمة</b>، وهو قول <b>الأوزاعي وإسحاق بن راهويه</b>.<br>٣- <b>الرأي الثالث:</b> كراهة بيع المزايدة مطلقاً، وهو قول <b>إبراهيم النخعي</b>."],
["٣٨. اذكر أدلة الآراء الثلاثة في حكم بيع المزايدة مع المناقشة والترجيح. (سؤال كتاب - ص ٢٣٥-٢٤٠)","<b>• أدلة الرأي الأول (الجمهور - الجواز مطلقاً):</b><br>١- <b>من السنة:</b> حديث جابر رضي الله عنه أن رجلاً أعتق غلاماً له عن دبر فاحتاج، فأخذه النبي ﷺ فقال: «مَنْ يَشْتَرِيهِ مِنِّي؟» فاشتراه نعيم بن عبد الله بكذا وكذا فدفعه إليه (البخاري). (ونوقش بأنه ليس فيه زيادة، وأجاب ابن بطال بأن قوله «من يشتريه مني» عرض للزيادة ليستقضي للمفلس).<br>٢- حديث أنس بن مالك رضي الله عنه أن رسول الله ﷺ باع حِلساً وقدحاً وقال: «مَنْ يَشْتَرِي هَذَا الْحِلْسَ وَالْقَدَحَ؟» فقال رجل: أخذتهما بدرهم، فقال النبي ﷺ: «مَنْ يَزِيدُ عَلَى دِرْهَمٍ؟ مَنْ يَزِيدُ عَلَى دِرْهَمٍ؟» فأعطاه رجل درهمين فباعهما منه (رواه الترمذي وحسنه). (<b>الحِلس:</b> كساء يجعل على ظهر البعير تحت رحله ويبسط في البيت، <b>والقدح:</b> إناء الشرب أو السهم قبل أن يُراش).<br>٣- <b>الأثر:</b> عن مجاهد وعطاء قالا: «لا بأس من بيع من يزيد».<br>٤- <b>الإجماع:</b> نقله ابن قدامة في المغني أن المسلمين يبيعون في أسواقهم بالمزايدة.<br>٥- <b>المعقول:</b> لأن الحاجة ماسة إليه فهو بيع الفقراء والمحتاجين، ولو تُرك لدخل الضرر على الباعة ببخس سلعهم.<br><b>• أدلة الرأي الثاني (الأوزاعي وإسحاق):</b> حديث ابن عمر: «نهى رسول الله ﷺ أن يبيع أحدكم على بيع أخيه إلا الغنائم والمواريث»، وأثر الحسن وابن سيرين. <b>ونوقش:</b> بأن في إسناده ابن لهيعة وهو ضعيف، وذكر الغنائم والمواريث خرج مخرج الغالب.<br><b>• أدلة الرأي الثالث (النخعي):</b> حديث «لا يسم المسلم على سوم أخيه» وحديث «ينهى عن المزايدة». <b>ونوقش:</b> بأن النهي عن السوم هو بعد رضا البائع واستقرار الثمن لا في المزايدة.<br><b>• الراجح:</b> الرأي الأول القائل بالجواز مطلقاً لقوة أدلتهم ولتعلق حاجة الناس به."],
["٣٩. بيّن معنى وحكم «بيع الرجل على بيع أخيه» (التكليفي والوضعي) وشروط منعه الأربعة، والفرق بينه وبين المناقصة. (ص ٢٤١-٢٤٤)","<b>• معناه:</b> أن يتراضى البائع والمشتري على ثمن سلعة فيجيء آخر في زمن الخيارين فيقول للمشتري: أنا أبيعك مثل هذه السلعة بأنقص من هذا الثمن، أو خيراً منها بثمنها فيفسخ البيع. (وفي معناه <b>الشراء على الشراء</b>: أن يدفع للبائع في زمن الخيار أكثر من ثمن المشتري الأول).<br><b>• حكمه التكليفي:</b> يحرم عند جمهور الفقهاء (المالكية والشافعية والحنابلة والظاهرية)، ومكروه تحريماً عند الحنفية؛ لحديث ابن عمر: «لا يبيع بعضكم على بيع أخيه» (متفق عليه).<br><b>• حكمه الوضعي (صحة العقد - رأيان):</b><br>١- <b>الرأي الأول (وهو الراجح):</b> <b>صحة البيع مع لحوق الإثم</b>، وهو قول جمهور الفقهاء من الحنفية، والمالكية في قول، والشافعية، والحنابلة في رواية، والزيدية؛ لأنه عقد مكتمل الأركان والشروط والنهي لأمر خارج.<br>٢- <b>الرأي الثاني:</b> بطلان البيع، وهو قول ثان للمالكية وظاهر مذهب الحنابلة والظاهرية.<br><b>• شروط تطبيق منع بيع الرجل على بيع أخيه (٤ شروط):</b><br>١- أن يقع من غير إذن البائع أو المشتري (فلو أذن المتضرر لم يحرم).<br>٢- أن يقع بعد رضا المتعاقدين على الثمن (بخلاف ما لو لم يركن أحدهما للآخر فهو بيع من يزيد الجائز).<br>٣- أن يقع قبل اللزوم أي في زمن الخيارين (خيار المجلس وخيار الشرط)، فلو وقع بعد لزوم البيع فلا حرمة لعدم تمكنه من الفسخ.<br>٤- أضاف بعض الشافعية: ألا يكون المشتري مغبوناً غبناً فاحشاً، وإلا جاز لأن الدين النصيحة.<br><b>• الفرق بينه وبين المناقصة:</b> المناقصة لا تدخل تحت النهي؛ لعدم حصول ركون أو إبرام عقد مع المتقدم الأول."],
["٤٠. بيّن معنى «السوم على السوم» وحكمه وحكمته وشروط منعه، والفرق بينه وبين البيع على البيع والمناقصة. (سؤال كتاب - ص ٢٤٤-٢٤٦)","<b>• معنى السوم:</b> الذهاب في ابتغاء الشيء والتساوم بين اثنين. <b>ومعنى السوم على السوم:</b> أن يتفق صاحب السلعة والراغب فيها على البيع ولم يعقداه (بعد استقرار الثمن والركون وقبل العقد)، فيقول آخر لصاحبها: أنا أشتريها بأكثر، أو للراغب: أنا أبيعك خيراً منها بأرخص.<br><b>• الفرق بين البيع على بيعه والسوم على سومه:</b> في البيع على بيعه تم العقد ولكن بينهما خيار مجلس أو شرط، أما في السوم على سومه فهو بعد الاتفاق والركون وقبل إبرام العقد.<br><b>• حكمه وحكمته:</b> يحرم عند الجمهور ومكروه تحريماً عند الحنفية؛ لما فيه من إخلال بالمروءة وإيغار للصدور وإثارة للنزاع والشحناء.<br><b>• شروط منعه:</b> (١- أن يكون بعد استقرار الثمن، ٢- بعد حصول التراضي والركون بين المتعاقدين، ٣- عدم الإذن من المتضرر منهما).<br><b>• الفرق بين المناقصات والسوم على السوم:</b> في السوم على السوم ورد السوم الثاني بعد استقرار الثمن ورضا المتعاقدين، أما المناقصات فهي قبل استقرار الثمن وقبل الركون، مع وجود الإذن من صاحب المناقصة للجميع بالتنافس، فلم تدخل تحت النهي."],
["٤١. عرّف «النجش» لغةً وشرعاً، وما حكمه التكليفي؟ وما الآراء الثلاثة في صحة البيع إذا وقع مع النجش؟ (ص ٢٤٦-٢٤٩)","<b>• النجش لغة:</b> الاستتار؛ لأنه يستر قصده ويخفيه، ومنه يقال للصائد: ناجش لاستتاره.<br><b>• شرعاً:</b> أن يمدح السلعة ويطلبها بثمن ثم لا يشتريها لنفسه ولكن ليسمع غيره فيزيد في ثمنها ليضر المشتري وينفع البائع (ومن صوره مدح البائع سلعته بالكذب ليغر غيره).<br><b>• حكمه التكليفي:</b> ذهب الجمهور (المالكية والشافعية والحنابلة والظاهرية والزيدية) إلى <b>حرمة النجش</b>. وذهب <b>الحنفية</b> إلى أنه مكروه تحريماً فيما لو بلغت السلعة قيمتها، أما إذا لم تبلغ قيمتها فلا كراهة لانتفاء الخداع والتدليس. لقوله تعالى: ﴿وَالَّذِينَ يُؤْذُونَ الْمُؤْمِنِينَ...﴾ وحديث ابن عمر: «نهى النبي ﷺ عن النجش» (متفق عليه).<br><b>• حكم البيع إذا وقع مع النجش (٣ آراء للفقهاء):</b><br>١- <b>الرأي الأول:</b> صحة البيع ولزومه مطلقاً وعصيان الناجش (قول الحنفية، ووجه للشافعية، والمختار عند الإباضية).<br>٢- <b>الرأي الثاني:</b> البيع صحيح ويثبت فيه الخيار للمشتري إذا كان بمواطأة البائع (المالكية في قول، والشافعية في وجه، ورواية للحنابلة، والظاهرية، والزيدية، والإباضية في قول ثان). وأضاف <b>الحنابلة</b>: أن الخيار يثبت إذا غُبن غبناً غير معتاد وإن لم يكن بمواطأة البائع. واشترطت <b>الظاهرية</b> ألا يكون المشتري اشترط السلامة في العقد.<br>٣- <b>الرأي الثالث:</b> البيع باطل (رواية عن الإمام أحمد)."],
["٤٢. اذكر أدلة الآراء الثلاثة في حكم البيع مع النجش والترجيح، وما العلاقة والفرق بين النجش والمناقصة؟ (سؤال كتاب - ص ٢٤٩-٢٥٢)","<b>• أدلة الرأي الأول (الصحة واللزوم):</b> أن النهي في حديث «نهى عن النجش» عائد إلى الناجش لا إلى ذات العقد ولأمر خارج فلم يفسد، والمشتري زاد باختياره.<br><b>• أدلة الرأي الثاني (الصحة مع ثبوت الخيار):</b> القياس على حديث أبي هريرة في المصراة: «من اشترى غنماً مصراة فاحتلبها فإن رضيها أمسكها وإن سخطها ففي حلبتها صاع من تمر» (والمصراة: التي حُبس اللبن في ضرعها أياماً ليُرى أنها كثيرة اللبن)، وكما في تلقي الركبان، ولأن النهي لحق الآدمي فيجبر بالخيار.<br><b>• أدلة الرأي الثالث (البطلان):</b> حديث عائشة «من عمل عملاً ليس عليه أمرنا فهو رد»، وأثر عمر بن عبد العزيز أنه رد بيع السبي لما علم بوجود ناجش وقال: «ألا إن البيع مردود وإن النجش لا يحل».<br><b>• الترجيح:</b> القول <b>بصحة البيع مع ثبوت الخيار للمشتري</b> متى كان بمواطأة البائع ووقع بأكثر من قيمته جبراً للغبن ولحديث «لا ضرر ولا ضرار».<br><b>• العلاقة والفرق بين المناقصة والنجش:</b> صورة النجش قد توجد في المناقصة لكن <b>معكوسة</b>؛ كأن تتواطأ الجهة الإدارية مع أحد المشتركين ليقدم عطاءً بثمن أقل من السوق وهو غير مريد للبيع حقيقة ليخدع غيره فينقصوا أسعارهم، فيلحق مقدم العطاء الإثم للخديعة وإن لم يوجد تواطؤ. وتفترق المناقصة الصحيحة عن النجش في ثبوت قصد العقد الحقيقي وانتفاء الخديعة."],
["٤٣. ما العناصر الخمسة المؤثرة في تكاليف كراسة الشروط؟ وما الآراء الأربعة في حكم بيعها مع الأدلة والترجيح؟ (سؤال كتاب - ص ٢٥٣-٢٥٩)","<b>• العناصر الخمسة المؤثرة في تكلفتها:</b> (١- المجهود الذهني المبذول في دراسة المشروع وإعداده، ٢- تكاليف إعداد الخرائط والرسوم والمخططات، ٣- تكاليف الخدمات والاستشارات الهندسية، ٤- قيمة الأوراق المتعلقة بالمشروع، ٥- حصة من المصاريف الإدارية تقدر بنسبة ١٠٪ من مجموع العناصر السابقة).<br><b>• الآراء الأربعة فيمن يتحمل تكلفتها وحكم بيعها:</b><br><b>١- الرأي الأول (الجواز مطلقاً - وهو الراجح):</b> جواز بيع كراسة الشروط لمن يرغب المشاركة في المناقصة بما لا يزيد على قيمتها الفعلية (الشيخ مختار السلامي، د. عبد الله المنيع، أبو سليمان في قول ثان، والشيخ حسن الجواهري).<br>— <b>أدلتهم:</b> (١- عموم أدلة حل البيع والتجارة عن تراض، ٢- أنها وثيقة مادية مسعرة لم يلزم بها أحد ظلماً، ٣- القصد وضع المشارك على بينة، ٤- تبين جدية المناقص، ٥- شرط سائغ «المسلمون على شروطهم»، ٦- حتى من لم يرسُ عليه العطاء يستفيد معرفة قدراته).<br><b>٢- الرأي الثاني:</b> يتحمل قيمتها <b>المناقِص الذي رست عليه المناقصة فقط</b> (الشيخ عبد الوهاب أبو سليمان في قوله الأول)؛ لأن غيره يدفع الرسوم دون مقابل.<br><b>٣- الرأي الثالث:</b> وجوب <b>بذلها بالمجان</b> على الجهة المصدرة، ويجوز أخذ تأمين يُرد إليه إذا رد الدفتر (د. رفيق المصري)؛ لأن الغنم للجهة فعليها الغرم، وتحميل غير الفائز أشبه بالضريبة.<br><b>٤- الرأي الرابع (التفصيل):</b> يجوز بيعها إذا اشتملت على دراسات فنية ورسم خرائط بتكلفتها الفعلية، أما إن كانت مجرد شروط العقد فلا يجوز بيعها لأنها بمنزلة بيان شروط العقد من أحد العاقدين (د. محمد تقي العثماني)."],

"الوحدة الثالثة: الضمان في المناقصات والالتزامات والجوائح (ص ٢٦٠ - ٢٨٤)",
["٤٤. عرّف الضمان واذكر أدلته، وما حكم الضمان الابتدائي في المناقصات؟ وما علاقته ببيع العربون وآراء الفقهاء فيه؟ (ص ٢٦١-٢٦٦)","<b>• تعريف الضمان وأدلته:</b> هو ضم ذمة الضامن إلى ذمة المضمون عنه في التزام الحق فيثبت في ذمتهما جميعاً ولصاحب الحق مطالبة من شاء منهما. وهو جائز بالكتاب ﴿وَلِمَن جَاءَ بِهِ حِمْلُ بَعِيرٍ وَأَنَا بِهِ زَعِيمٌ﴾ والسنة «العارية مؤداة والزعيم غارم والدين مقضي» والإجماع.<br><b>• الضمان الابتدائي:</b> هدفه التأكد من جدية المناقصين والتزامهم بالتعاقد عند الإرساء. <b>وحكمه:</b> جائز شرعاً، ويعد <b>أمانة</b> في يد المناقص له يُرد إلى من لم ترسُ عليهم المناقصة.<br><b>• حكم مصادرة الضمان الابتدائي إذا سحب المناقص عطاءه قبل الإرساء (وعلاقته ببيع العربون):</b><br>هذا يشبه بيع العربون، وقد اختلف الفقهاء في بيع العربون على رأيين:<br>١- <b>الرأي الأول (منع بيع العربون):</b> قول جمهور الفقهاء من المالكية والشافعية ورواية للحنابلة؛ لحديث عمرو بن شعيب «نهى رسول الله ﷺ عن بيع العربان» (أبو داود)، وأثر عطاء وابن طاوس، ولأنه أكل للمال بالباطل وشرط للبائع بلا عوض.<br>٢- <b>الرأي الثاني (صحة بيع العربون):</b> الصحيح من مذهب أحمد؛ لأثر نافع بن عبد الحارث في شراء دار السجن من صفوان بن أمية لعمر بن الخطاب، وأثر ابن سيرين.<br><b>• الترجيح في باب المناقصات (ص ٢٦٦):</b> رجح الكتاب هنا <b>الرأي الأول وهو منع بيع العربون</b> لأنه أكل لأموال الناس بالباطل؛ وبناءً على ذلك <b>فإن مصادرة الضمان المالي الابتدائي لا تجوز ولا يحق لصاحب المناقصة أخذه سواء ظفر المناقص بالعقد أم لا</b>."],
["٤٥. ما المقصود بالضمان النهائي في المناقصات؟ وما حكمه؟ ومتى تجوز المقاصة منه؟ (ص ٢٦٦-٢٦٧)","<b>• مفهومه:</b> ضمان يقدمه المناقص الذي رست عليه المناقصة خلال مدة محددة من تاريخ إخطاره برسو المناقصة عليه والتزامه بالتعاقد.<br><b>• الغاية منه وحكمه:</b> يباح للجهة الداعية للمناقصة المطالبة به لضمان التزام المناقص بتنفيذ كافة شروط العقد في المدة المحددة دون تأخير أو مخالفة.<br><b>• حكم مصادرته:</b> لا تجوز مصادرته إلا إذا لم يفِ صاحبه بواجبه تجاه تنفيذ العقد <b>وترتب على عدم وفائه ضرر مالي فعلي للمناقَص له</b>، وفي تلك الحالة يمكن إيقاع المقاصة بين مبلغ الضمان النهائي وبين ما يجب على المناقص المتعهد من تعويض مالي بقدر الضرر."],
["٤٦. عرّف «خطاب الضمان المصرفي» وبيّن فائدته في المناقصات الداخلية والدولية، وأقسامه، وكيفية إصداره. (سؤال كتاب - ص ٢٦٧-٢٧٠)","<b>• تعريفه:</b> تعهد كتابي بناءً على طلب العميل يلتزم فيه المصرف لصالح العميل في مواجهة شخص ثالث بدفع مبلغ معين في وقت معين. وعرفه د. بكر أبو زيد: تعهد قطعي مقيد بزمن محدد غير قابل للرجوع يصدر من البنك بناء على طلب عميله بدفع مبلغ معين لأمر جهة مستفيدة متى تأخر أو قصر العميل، ويرجع البنك بعد ذلك على العميل بما دفعه.<br><b>• فائدته:</b><br>١- حماية المستفيد وضمان كفاءة العميل المالية والمعنوية.<br>٢- بدلاً من أن يحجز المناقص نقوداً له تتعطل طويلاً، يعطيه المصرف خطاب ضمان.<br>٣- في المناقصات الدولية يوفر على مقدم الضمان إجراءات تحويل العملة واستردادها ويحميه من خسائر هبوط أسعار العملة.<br><b>• أقسامه:</b><br>١- <b>من حيث الغطاء وعدمه:</b> (أ- مغطى تغطية كاملة ١٠٠٪، ب- مغطى تغطية جزئية كـ ٥٠٪ أو غير مغطى).<br>٢- <b>من حيث الغرض منه:</b> (أ- خطاب ضمان ابتدائي لا يتجاوز ١٠٪ من حجم المشروع، ب- خطاب ضمان نهائي لتأكيد التنفيذ).<br><b>• كيفية إصداره:</b> يتقدم العميل بطلب، ويتأكد البنك من كفاءته، وإذا كان المبلغ كبيراً يطلب تأمينات (رهناً عقارياً أو أسهماً أو أوراقاً مالية أو كفالة بنك خارجي)، ويحتفظ البنك عادة بتأمينات نقدية يودعها العميل بنسبة حوالي <b>٢٥٪</b> من قيمة الضمان تزيد أو تقل تبعاً لمركز العميل، ثم يصدر الخطاب."],
["٤٧. ما التكييف الفقهي لخطاب الضمان المصرفي؟ وما الآراء الثلاثة في حكم أخذ المصرف عمولة (أجراً) على إصداره مع الأدلة والترجيح وقرار المجمع؟ (ص ٢٧٠-٢٧٥)","<b>• التكييف الفقهي وحكمه:</b> علاقة البنك بالجهة المستفيدة علاقة <b>ضمان وكفالة</b> (والابتدائي ضمان لما سيجب وهو جائز عند الجمهور للحاجة الداعية إليه). وعلاقة البنك بالعميل تختلف حسب الغطاء.<br><b>• حكم أخذ المصرف عمولة لإصداره (٣ آراء للمعاصرين):</b><br><b>١- الرأي الأول (المنع مطلقاً):</b> لا يجوز أخذ مقابل سواء كان له غطاء أم لا (د. بكر أبو زيد، د. عبد الستار أبو غدة، د. خالد المشيقح، د. ياسر بن طه، هيئة كبار العلماء)؛ لأن الكفالة من عقود الإرفاق والتبرع، وأخذ الأجر عليها يجعلها قرضاً جر نفعاً، وانتفاع الضامن بالغطاء المرهون محرم.<br><b>٢- الرأي الثاني (الجواز مطلقاً):</b> يجوز باعتباره عقد وكالة بأجر وللمصلحة (د. زكريا البري).<br><b>٣- الرأي الثالث (التفصيل - وهو الراجح):</b> إن كان له غطاء جاز للمصرف أخذ الأجر لأنه وكالة وكفالة معاً والوكالة تجوز بأجر (كما بعث النبي ﷺ عماله لقبض الصدقات بجعل)، وإن لم يكن له غطاء لم يجز أخذ أجر على الضمان لما فيه من شبهة الربا، ولكن <b>يجوز أخذ تكاليف الإصدار الفعلية فقط</b> (بمقدار جهده وإجراءات عمله دون ربط الأجر بمبلغ الضمان أو مدته) (د. علي السالوس، د. وهبة الزحيلي).<br><b>• قرار مجمع الفقه الإسلامي بجدة (الدورة الثانية ١٤٠٦هـ / ١٩٨٥م):</b><br>١- إن خطاب الضمان لا يجوز أخذ الأجر عليه لقاء عملية الضمان (والتي يراعى فيها عادة مبلغ الضمان ومدته) سواء أكان بغطاء أم بدونه.<br>٢- أما المصاريف الإدارية لإصدار خطاب الضمان بنوعيه فجائزة شرعاً مع مراعاة عدم الزيادة على أجر المثل."],
["٤٨. اذكر حكمة مشروعية المناقصة، وخصائص عقد المناقصة التسع بالتفصيل. (ص ٢٧٦-٢٧٨)","<b>أولاً: حكمة مشروعية المناقصة (٤ نقاط):</b><br>١- حصول المناقص له على أكبر منفعة بأقل تكلفة امتثالاً لقوله تعالى: ﴿وَالَّذِينَ إِذَا أَنفَقُوا لَمْ يُسْرِفُوا وَلَمْ يَقْتُرُوا وَكَانَ بَيْنَ ذَلِكَ قَوَامًا﴾ [الفرقان: ٦٧].<br>٢- تشكل وسائل رقابة على النفقات العامة للدولة لحفظ المال العام من العبث والإهدار.<br>٣- تحقيق المصلحة مع دفع التهمة عمن يباشر أموال اليتامى والأوقاف والمدارس.<br>٤- ضمان تنفيذ المشاريع على الوجه المطلوب وفي الوقت المحدد بأفضل الشروط.<br><b>ثانياً: خصائص عقد المناقصة (٩ خصائص):</b><br>١- <b>عقد رضائي:</b> يتوقف على رضا المناقِص والمناقَص له.<br>٢- <b>عقد معاوضة:</b> كل طرف يقصد الحصول على منفعته مقابل عوض.<br>٣- <b>عقد إذعان:</b> لأن المناقَص له ينفرد بوضع شروطه مسبقاً، وليس للمناقِص إلا قبول العقد كاملاً أو رفضه كاملاً دون حق في تعديل الشروط.<br>٤- <b>عقد مركب:</b> يتضمن مجموعة عقود (بيع دفتر الشروط + الضمان + العقد المتعلق بموضوع المناقصة).<br>٥- <b>عقد ملزم:</b> يجب على كل منهما الوفاء بما التزم به.<br>٦- <b>عقد محدد:</b> يحدد المعقود عليه تحديداً دقيقاً يفضي للعلم به (فليس عقداً احتمالياً كالجعالة).<br>٧- <b>عقد مستمر (متراخي التنفيذ):</b> تحصل فيه المنفعة أو التوريد على فترات زمنية.<br>٨- <b>عقد إجرائي:</b> يتم وفق منظومة من الإجراءات.<br>٩- <b>عقد مستحدث:</b> لم يكن معروفاً عند المتقدمين وهو جائز على أصل الإباحة."],
["٤٩. ما الالتزامات المترتبة على عقد المناقصة لكلٍّ من (المناقِص) و(المناقَص له)؟ وما فتوى بيت التمويل الكويتي في الأعمال الإضافية؟ (ص ٢٧٨-٢٨٠)","<b>أولاً: التزامات المناقِص (٣ التزامات):</b><br>١- <b>تنفيذ العمل الذي تعهد به</b> وفق الشروط والمواصفات المتفق عليها، فإن لم تكن هناك شروط فالمرجع إلى العرف عند أهل كل صنعة.<br>٢- <b>تسليم العمل بعد إنجازه</b> خلال المدة الزمنية المحددة بالتخلية بينه وبين المناقص له في المكان المتفق عليه، فإن تأخر بلا قوة قاهرة تحمل المسؤولية والجزاءات.<br>٣- <b>ضمان العمل بعد تسليمه:</b> ويعرف بـ (<b>ضمان حسن أداء المعقود عليه</b>) بعد التسليم مدة معينة.<br><b>ثانياً: التزامات المناقَص له (٣ التزامات):</b><br>١- <b>تمكين المناقص من تنفيذ العمل</b> بعدم الحيلولة بينه وبين البدء بالتنفيذ؛ لقوله تعالى: ﴿أَوْفُوا بِالْعُقُودِ﴾.<br>٢- <b>دفع العوض (المقابل المالي)</b> وفق المقدار والجنس والنوع وطريقة الدفع.<br>٣- <b>تعويض المناقص عن الإضافات اللازمة والمفيدة</b> التي لم تطلب في العقد إذا تبين أنها لازمة لإتمام العمل.<br><b>• فتوى بيت التمويل الكويتي:</b> إذا جرت في عقد المقاولة مسائل تقتضي المصلحة إتمامها فيكون السعر مثل ما ورد في العقد ويدفع للمقاول قيمة الأعمال التي جدت ويرجع بها على العميل، فإن لم يرد نص في العقد حكم في ذلك العرف."],
["٥٠. ما مفهوم «الجائحة» لغةً واصطلاحاً؟ وما حكم عجز المناقص عن تنفيذ العقد لظروف طارئة وفق كلام ابن تيمية وقرار مجمع الفقه الإسلامي؟ (ص ٢٨٠-٢٨٤)","<b>• مفهوم الجائحة لغة:</b> مشتقة من الجوح وهو الاستئصال، وهي المصيبة تحل بالرجل في ماله فتجتاحه كله.<br><b>• الجائحة اصطلاحاً عند الفقهاء:</b><br>— <b>ابن عرفة:</b> ما أتلف من معجوز عن دفعه عادة قدراً من ثمر أو نبات بعد بيعه.<br>— <b>في المجموع والمبدع:</b> كل آفة سماوية لا صنع للآدمي فيها كالريح والحر والبرد والعطش فتهلك الثمر قبل أوان جذه، فهو من ضمان البائع.<br>— <b>التعريف العام المعاصر:</b> حدث عام طارئ أثناء تنفيذ العقد، غير متوقع الحدوث وقت إبرامه، ويتعذر دفعه، يسبب خسارة فادحة للمدين إذا استمر في تنفيذ التزامه.<br><b>• حكم عجز المناقص لظروف طارئة:</b> يجوز له اللجوء للقضاء لتخفيف ذلك اعتماداً على الرأي القائل <b>بوضع الجوائح</b>؛ لحديث: «لو بعت من أخيك ثمراً فأصابته جائحة فلا يحل لك أن تأخذ منه شيئاً». وقال <b>ابن تيمية</b>: إن المعاوضة مبناها على المعادلة والمساواة، فإذا تلف المقصود بأمر سماوي قبل التمكن من قبضه بطل العقد ووجب رد الثمن.<br><b>• نص قرار مجمع الفقه الإسلامي في العقود المتراخية التنفيذ:</b><br><b>أولاً:</b> في العقود المتراخية التنفيذ (كالتوريد والمقاولات) إذا تبدلت الظروف بأسباب طارئة عامة غير متوقعة ألحقت بالملتزم خسائر جسيمة غير معتادة دون تقصير أو إهمال منه، <b>يحق للقاضي عند التنازع تعديل الحقوق والالتزامات العقدية بصورة توزع القدر المتجاوز من الخسارة على الطرفين المتعاقدين</b>، كما يجوز له <b>فسخ العقد فيما لم يتم تنفيذه مع تعويض عادل للملتزم له</b>، بالاعتماد على أهل الخبرة الثقات.<br><b>ثانياً:</b> يحق للقاضي أيضاً <b>إمهال الملتزم</b> إذا وجد أن السبب الطارئ قابل للزوال في وقت قصير ولا يتضرر الملتزم له كثيراً؛ تحقيقاً للعدل ومنعاً للضرر المرهق."]
];
